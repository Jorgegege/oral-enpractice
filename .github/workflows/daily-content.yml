name: 每日内容更新

# 每天 UTC 22:00（= 北京时间 06:00）自动生成当日跟读计划并提交回仓库
# 也可手动触发（Actions 页面 → 本工作流 → Run workflow）
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 生成今日计划
        run: node scripts/build-daily.mjs

      - name: 提交更新
        run: |
          git config user.name "daily-content-bot"
          git config user.email "daily-content-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "没有内容变更，跳过提交"
          else
            git commit -m "chore(daily): 更新 $(TZ=Asia/Shanghai date +%F) 跟读计划"
            git push
          fi
