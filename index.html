<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>口语练习站 · Speaking Coach</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232F6B5E' d='M12 3C6.5 3 2 6.7 2 11.3c0 2.6 1.5 4.9 3.9 6.4-.2 1.2-.8 2.4-1.6 3.3 1.7-.2 3.3-.9 4.5-1.8 1 .3 2.1.5 3.2.5 5.5 0 10-3.7 10-8.2S17.5 3 12 3z'/%3E%3Cpath fill='%23F5F2EA' d='M7 10h1.5v3H7zM11 9h1.5v5H11zM15 10h1.5v3H15z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============ 设计变量 ============ */
:root{
  --bg:#E9F3EC;
  --bg-soft:#D8E9DD;
  --card:#FFFFFF;
  --ink:#1B2620;
  --ink-2:#46534B;
  --ink-3:#7E8B82;
  --line:#D3E5D9;
  --primary:#2F6B5E;
  --primary-deep:#235247;
  --primary-soft:#E2F0E8;
  --ok:#3E8E6E;
  --ok-soft:#E4F1EB;
  --warn:#D9A441;
  --warn-soft:#F7EDD8;
  --bad:#C25B4E;
  --bad-soft:#F8E7E4;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 1px 2px rgba(30,36,32,.06),0 6px 18px rgba(30,36,32,.07);
  --font-sans:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --font-serif:"Noto Serif SC",Georgia,"Times New Roman",serif;
  --font-en:Georgia,"Times New Roman",var(--font-sans);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-sans);
  background:var(--bg);
  color:var(--ink);
  line-height:1.6;
  min-height:100vh;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}

/* ============ 布局骨架 ============ */
.app{max-width:880px;margin:0 auto;padding:0 16px 96px}
.topbar{
  position:sticky;top:0;z-index:20;
  background:rgba(233,243,236,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{max-width:880px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--primary);display:grid;place-items:center;flex:none}
.brand-mark svg{width:20px;height:20px}
.brand-title{font-family:var(--font-serif);font-weight:700;font-size:18px;letter-spacing:.02em}
.brand-sub{font-size:12px;color:var(--ink-3)}
.topbar-spacer{flex:1}
.topbar-streak{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);background:var(--bg-soft);padding:6px 12px;border-radius:999px}

/* 底部导航 */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--card);border-top:1px solid var(--line);
}
.tabbar-inner{max-width:880px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:10px 4px 12px;font-size:11px;color:var(--ink-3);
}
.tab svg{width:22px;height:22px}
.tab.active{color:var(--primary);font-weight:500}

/* 视图切换 */
.view{display:none;padding-top:12px}
.view.active{display:block;animation:fadeIn .22s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view.active{animation:none}}

/* ============ 通用组件 ============ */
.section-title{font-family:var(--font-serif);font-size:20px;font-weight:700;margin:8px 0 4px}
.section-desc{font-size:13px;color:var(--ink-2);margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 18px;border-radius:var(--radius-sm);font-size:15px;font-weight:500;
  transition:background .15s ease,transform .1s ease;
}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-deep)}
.btn-primary.speaking{background:var(--warn)}
.btn-primary.done{background:var(--ok)}
.btn-ghost{background:var(--bg-soft);color:var(--ink)}
.btn-ghost:hover{background:var(--line)}
.btn-soft{background:var(--primary-soft);color:var(--primary)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.chip{
  display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:999px;
  font-size:12px;background:var(--bg-soft);color:var(--ink-2);border:1px solid transparent;
}
.chip.active{background:var(--primary);color:#fff}
.muted{color:var(--ink-3);font-size:12px}
.empty{
  text-align:center;padding:48px 20px;color:var(--ink-3);
}
.empty svg{width:40px;height:40px;margin-bottom:10px;opacity:.5}

/* 分类与难度标签 */
.cat-daily{background:#E7EEF5;color:#3A6284}
.cat-uss{background:#FBEBDD;color:#9A5A2E}
.cat-uk{background:#F3E9F1;color:#844A78}
.cat-animation{background:#EAF3E6;color:#4E7A3E}
.cat-literature{background:#F1EBDD;color:#8A6D2F}
.cat-business{background:#ECEAEF;color:#5A5470}
.cat-passage{background:#E2F0E8;color:#2F6B5E}
.cat-long{background:#E3F0F1;color:#2E6E74}
.lvl{font-size:11px;color:var(--ink-3);border:1px solid var(--line);border-radius:6px;padding:1px 6px}

/* ============ 首页 ============ */
.hero{padding:16px 18px 14px;margin-bottom:12px}
.hero-greet{font-size:13px;color:var(--ink-2);margin-bottom:6px}
.hero-remind{font-size:13px;font-weight:500;color:var(--primary);background:var(--primary-soft);border-radius:var(--radius-sm);padding:8px 12px;margin:8px 0 2px}
.hero-remind.done{color:var(--ok);background:var(--ok-soft)}
.hero h1{font-family:var(--font-serif);font-size:26px;line-height:1.35;margin-bottom:10px}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.hero-stat{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 12px;min-width:96px}
.hero-stat .num{font-size:22px;font-weight:700;font-family:var(--font-en)}
.hero-stat .lbl{font-size:12px;color:var(--ink-3)}
.plan-progress{margin-top:10px}
.plan-progress .bar{height:8px;border-radius:999px;background:var(--bg-soft);overflow:hidden}
.plan-progress .bar i{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .3s ease}
.plan-progress .row{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);margin-top:6px}

.daily-block{margin-bottom:12px}
.daily-block h2{font-size:16px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.session-list{display:flex;flex-direction:column;gap:10px}
.session-card{padding:14px;display:flex;gap:14px;align-items:flex-start}
.session-index{
  width:30px;height:30px;border-radius:10px;background:var(--primary-soft);color:var(--primary);
  display:grid;place-items:center;font-weight:700;font-family:var(--font-en);flex:none;
}
.session-card.done .session-index{background:var(--ok-soft);color:var(--ok)}
.session-body{flex:1;min-width:0}
.session-en{font-family:var(--font-en);font-size:17px;line-height:1.5;margin-bottom:3px}
.session-zh{font-size:13px;color:var(--ink-2)}
.session-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.session-actions{display:flex;gap:8px;flex:none}
.icon-btn{
  width:38px;height:38px;border-radius:10px;background:var(--bg-soft);display:grid;place-items:center;
}
.icon-btn svg{width:19px;height:19px}
.icon-btn:hover{background:var(--line)}
.icon-btn.on{background:var(--warn-soft);color:var(--warn)}

/* ============ 练习视图 ============ */
.practice-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.practice-head .back{width:38px;height:38px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.practice-progress{flex:1}
.practice-progress .bar{height:8px;border-radius:999px;background:var(--bg-soft);overflow:hidden}
.practice-progress .bar i{display:block;height:100%;background:var(--primary);border-radius:999px}
.practice-progress .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:5px}

.pcard{padding:16px 18px}
.pcard-cat{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.p-sentence{font-family:var(--font-en);font-size:26px;line-height:1.5;font-weight:600;margin-bottom:10px;overflow-wrap:break-word}
.p-sentence.is-passage{font-size:20px;line-height:1.7}
.p-sentence.is-passage div+div{margin-top:10px}
.session-en,.lib-en{overflow-wrap:break-word}
.p-zh{font-size:15px;color:var(--ink-2);margin-bottom:8px}
.p-note{background:var(--bg);border-left:3px solid var(--warn);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:10px 14px;font-size:13px;color:var(--ink-2);margin-bottom:12px}
.p-note b{color:var(--ink)}

.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.rate-group{display:inline-flex;background:var(--bg-soft);border-radius:10px;padding:3px}
.rate-group button{padding:6px 12px;border-radius:8px;font-size:13px;color:var(--ink-2)}
.rate-group button.active{background:var(--card);color:var(--primary);font-weight:600;box-shadow:var(--shadow)}

/* 词高亮 */
.word-row{display:flex;flex-wrap:wrap;gap:6px 10px;margin:8px 0 10px;font-family:var(--font-en);font-size:20px;line-height:1.7}
.w{padding:2px 4px;border-radius:6px}
.w.match{color:var(--ink)}
.w.miss{color:var(--bad);background:var(--bad-soft);text-decoration:underline wavy var(--bad)}
.w.extra{color:var(--warn);background:var(--warn-soft)}
.w.doubt{color:var(--warn)}
.w .ipa{font-size:12px;color:var(--ink-3);font-family:var(--font-sans);display:block;text-align:center}

/* 录音区 */
.rec-area{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0 4px}
.rec-btn{
  width:72px;height:72px;border-radius:50%;background:var(--primary);color:#fff;
  display:grid;place-items:center;position:relative;
}
.rec-btn svg{width:30px;height:30px}
.rec-btn.recording{background:var(--bad);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(194,91,78,.35)}70%{box-shadow:0 0 0 18px rgba(194,91,78,0)}100%{box-shadow:0 0 0 0 rgba(194,91,78,0)}}
@media (prefers-reduced-motion:reduce){.rec-btn.recording{animation:none}}
.rec-hint{font-size:13px;color:var(--ink-2)}

.feedback{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;display:none}
.feedback.show{display:block}
.score-ring{display:flex;align-items:center;gap:16px;margin-bottom:10px}
.score-num{font-family:var(--font-en);font-size:34px;font-weight:700}
.score-labels{font-size:13px;color:var(--ink-2)}
.transcript-box{background:var(--bg);border-radius:var(--radius-sm);padding:10px 12px;font-size:14px;margin-bottom:10px}
.transcript-box .lbl{font-size:12px;color:var(--ink-3);margin-bottom:4px}
.p-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}

.audio-replay{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--ink-2)}
.audio-replay audio{height:36px;flex:1;min-width:120px}

/* 环境自检 */
.self-check{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:6px}
.sc-row{display:flex;justify-content:space-between;gap:12px;font-size:12.5px}
.sc-k{color:var(--ink-3)}
.sc-v{font-weight:500}
.sc-v.ok{color:var(--ok)}
.sc-v.bad{color:var(--bad)}
.sc-v.warn{color:var(--warn)}

/* ============ 词库 ============ */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center}
.search-box{flex:1;min-width:160px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.search-box svg{width:17px;height:17px;color:var(--ink-3);flex:none}
.search-box input{border:none;outline:none;background:none;width:100%}
.filter-row{display:flex;flex-wrap:wrap;gap:8px}
.lib-list{display:flex;flex-direction:column;gap:12px}
.lib-card{padding:16px}
.lib-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:6px}
.lib-en{font-family:var(--font-en);font-size:18px;line-height:1.5}
.lib-zh{font-size:13px;color:var(--ink-2);margin-bottom:8px}
.lib-foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lib-actions{display:flex;gap:8px;margin-left:auto}

/* ============ 复习 / 统计 ============ */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat-cell{padding:16px;text-align:center}
.stat-cell .num{font-family:var(--font-en);font-size:26px;font-weight:700}
.stat-cell .lbl{font-size:12px;color:var(--ink-3)}
.week-chart{padding:18px}
.week-row{display:grid;grid-template-columns:44px 1fr 34px;gap:10px;align-items:center;margin:10px 0;font-size:13px}
.week-bar{height:10px;background:var(--bg-soft);border-radius:999px;overflow:hidden}
.week-bar i{display:block;height:100%;background:var(--primary);border-radius:999px}

/* ============ 更多 / 导出 / 设置 ============ */
.menu-list{display:flex;flex-direction:column;gap:12px}
.menu-item{padding:16px;display:flex;align-items:center;gap:14px}
.menu-item .icon{width:40px;height:40px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:none}
.menu-item .icon svg{width:20px;height:20px}
.menu-item .meta{flex:1;min-width:0}
.menu-item .meta h3{font-size:15px;font-weight:600}
.menu-item .meta p{font-size:12px;color:var(--ink-3)}
.export-group{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);gap:12px}
.settings-row:last-child{border-bottom:none}
.switch{position:relative;width:46px;height:26px;background:var(--line);border-radius:999px;transition:background .15s;flex:none}
.switch.on{background:var(--primary)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.switch.on::after{transform:translateX(20px)}
select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;background:var(--bg);resize:vertical}

.note-banner{background:var(--warn-soft);border-radius:var(--radius-sm);padding:12px 14px;font-size:12.5px;color:var(--ink-2);margin-bottom:16px;line-height:1.6}

@media (max-width:560px){
  .hero h1{font-size:22px}
  .p-sentence{font-size:21px}
  .stat-grid{grid-template-columns:repeat(3,1fr)}
  .stat-cell{padding:12px 8px}
  .stat-cell .num{font-size:21px}
  .brand-sub{display:none}
  .brand-title{font-size:16px}
  .topbar-streak{padding:6px 10px;font-size:12px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path fill="#F5F2EA" d="M12 3C6.5 3 2 6.7 2 11.3c0 2.6 1.5 4.9 3.9 6.4-.2 1.2-.8 2.4-1.6 3.3 1.7-.2 3.3-.9 4.5-1.8 1 .3 2.1.5 3.2.5 5.5 0 10-3.7 10-8.2S17.5 3 12 3z"/><path fill="#2F6B5E" d="M7 10h1.5v3H7zM11 9h1.5v5H11zM15 10h1.5v3H15z"/></svg>
      </div>
      <div>
        <div class="brand-title">口语练习站</div>
        <div class="brand-sub">Speaking Coach · 自用跟读训练</div>
      </div>
    </div>
    <div class="topbar-spacer"></div>
    <div class="topbar-streak" id="streakBadge"></div>
  </div>
</header>

<main class="app">
  <!-- 视图：今日训练 -->
  <section class="view" id="view-home"></section>
  <!-- 视图：跟读练习 -->
  <section class="view" id="view-practice"></section>
  <!-- 视图：例句库 -->
  <section class="view" id="view-library"></section>
  <!-- 视图：复习（收藏/错题） -->
  <section class="view" id="view-review"></section>
  <!-- 视图：统计 -->
  <section class="view" id="view-stats"></section>
  <!-- 视图：更多（导出/导入/设置） -->
  <section class="view" id="view-more"></section>
</main>

<nav class="tabbar">
  <div class="tabbar-inner">
    <button class="tab" data-route="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      今日
    </button>
    <button class="tab" data-route="library">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M14 4h4.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H14z"/></svg>
      词库
    </button>
    <button class="tab" data-route="review">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2.4 5.3 5.6.6-4.2 3.8 1.2 5.6L12 15.4 7 18.3l1.2-5.6L4 8.9l5.6-.6z"/></svg>
      复习
    </button>
    <button class="tab" data-route="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      统计
    </button>
    <button class="tab" data-route="more">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.5h.1a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.5 1z"/></svg>
      更多
    </button>
  </div>
</nav>

<script>
/* ==================== 内置例句库 ====================
 * cat: daily 日常 / usshow 美剧 / ukshow 英剧 / literature 书籍 / animation 动漫 / business 商务 / long 中长句 / passage 长段落
 * level: A2 入门 / B1 进阶 / B2 提高
 * 说明：名著均取自公版文本；影视类为原创风格化例句，未使用任何受版权保护的台词或音频。
 */
let RAW_DATA = [];

/* ==================== 分类元数据 ==================== */
const CAT_META = {
  daily:{label:"日常会话",cls:"cat-daily"},
  usshow:{label:"美剧口语",cls:"cat-uss"},

function normalizeWords(text){
  return (text||"").toLowerCase()
    .replace(/[^a-z0-9' \-]/g," ")
    .replace(/['\-]/g," ")
    .trim().split(/\s+/).filter(Boolean);
}
function splitSentences(text){
  const m=(text||"").match(/[^.!?]+[.!?]+/g);
  return m&&m.length?m:[text||""];
}
/* 顺序对齐：返回原句每词状态 match/miss，以及识别多出的词 extra */
function alignWords(targetText, recognizedText){
  const t = normalizeWords(targetText);
  const r = normalizeWords(recognizedText);
  const res = t.map(w=>({word:w, state:"miss"}));
  const extras = [];
  let j = 0;
  for(let i=0;i<t.length;i++){
    if(j<r.length && t[i]===r[j]){ res[i].state="match"; j++; continue; }
    const k = r.indexOf(t[i], j);
    if(k>-1){ for(let x=j;x<k;x++) extras.push(r[x]); j=k+1; res[i].state="match"; }
    else { res[i].state="miss"; }
  }
  for(let x=j;x<r.length;x++) extras.push(r[x]);
  return {target:res, extras, matchCount:res.filter(x=>x.state==="match").length};
}
function scoreOf(align){ const n=align.target.length; return n? Math.round(align.matchCount/n*100) : 0; }
function scoreLabel(score){

/* ==================== 每日计划 ==================== */
const SHORT_TARGET = 15;  // 每日短句
const LONG_TARGET = 5;     // 每日末尾中长句（30–50 词）
function buildDailyPlan(){
  const doneToday = todayHistory().map(h=>h.id);
  const plan=[];
  const isLong = s => s.kind==="passage" || s.kind==="long";
  // 1) 错题优先复习（最多 3 句，仅短句）
  store.wrong.filter(id=>findSentence(id)).slice(0,3).forEach(id=>{
    const s=findSentence(id); if(s && !isLong(s)) plan.push(Object.assign({},s,{_review:true}));
  });
  // 2) 按日期轮换分类补充短句
  const seed=hashCode(todayKey());
  const cats=Object.keys(CAT_META).filter(k=>k!=="passage"&&k!=="long");
  const rot=seed%cats.length;
  const rotated=cats.slice(rot).concat(cats.slice(0,rot));
  const levelRank={B2:2,B1:1,A2:0};
  const pool=allSentences().filter(s=>!isLong(s) && !doneToday.includes(s.id)&&!plan.find(p=>p.id===s.id))
    .sort((a,b)=>(levelRank[b.level]||0)-(levelRank[a.level]||0));
  let ci=0, guard=0;
  while(plan.length<SHORT_TARGET && pool.length && guard<400){
    const cat=rotated[ci%rotated.length];
    const cand=pool.find(s=>s.cat===cat && !plan.find(p=>p.id===s.id));
    if(cand) plan.push(cand);
    ci++; guard++;
    if(ci%rotated.length===0 && plan.length<SHORT_TARGET){
      const rest=pool.find(s=>!plan.find(p=>p.id===s.id));
      if(rest) plan.push(rest);
    }
  }
  // 3) 末尾 5 句中长句（段落 / 长句），按日期轮换
  const longs=allSentences().filter(s=>isLong(s) && !doneToday.includes(s.id));
  if(longs.length){
    const base=seed%longs.length;
    for(let k=0;k<LONG_TARGET && longs.length;k++){
      plan.push(Object.assign({},longs[(base+k)%longs.length],{_passage:true}));
    }
  }
  return plan;
}
/* 当日计划去重单词数 */
function dailyUniqueWords(plan){
  const set=new Set();
  (plan||[]).forEach(s=>normalizeWords(s.en).forEach(w=>set.add(w)));
  return set.size;
}

  const permEl=document.getElementById("scPerm");
  if(!navigator.permissions||!navigator.permissions.query){
    permEl.textContent="需点击麦克风后授权"; permEl.className="sc-v warn";
    return;
  }
  navigator.permissions.query({name:"microphone"}).then(p=>{
    const map={granted:["已授权","ok"],denied:["已拒绝","bad"],prompt:["未授权，点麦克风时允许","warn"]};
    const [txt,cls]=map[p.state]||[p.state,"warn"];
    permEl.textContent=txt; permEl.className="sc-v "+cls;
  }).catch(()=>{ permEl.textContent="无法查询权限"; permEl.className="sc-v warn"; });
}
let traceLog=[];
function traceEvent(name, cls){
  const el=document.getElementById("scTrace");
  if(!el) return;
  traceLog.push(name);
  el.textContent=traceLog.join(" → ");
  el.className="sc-v "+(cls||"warn");
}

function renderWords(s){
  if(session.result && !session.result.manual){
    const words=session.result.align.target.map(w=>`<span class="w ${w.state}">${esc(w.word)}</span>`).join("");
    const extras=session.result.align.extras.length?`<span class="muted">＋</span>`+session.result.align.extras.map(e=>`<span class="w extra">${esc(e)}</span>`).join(""):"";
    return words+extras;
  }
  return normalizeWords(s.en).map(w=>`<span class="w match">${esc(w.word)}</span>`).join(" ");
}

/* ---------- 录音与识别 ---------- */
function toggleRecord(){
  if(rec.active){ stopAll(); return; }
  // 有语音识别接口：只跑识别，不再同时启动 MediaRecorder，避免两条链路抢占音频通道
  // 注意：iOS Safari 要求 recognition.start() 必须在点击事件的同步调用栈内，因此识别分支保持同步，不走 async
  if(SR){ startRecognition(); return; }
  startRecorderFallback();
}
async function startRecorderFallback(){
  // 无识别接口：退化为纯录音 + 手动自评
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    document.getElementById("recHint").textContent="当前浏览器不支持录音，请用 Safari / Chrome。"; return;
  }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    rec.stream=stream; rec.chunks=[];
    const mime = MediaRecorder.isTypeSupported("audio/mp4") ? "audio/mp4" : "audio/webm";
    rec.recorder=new MediaRecorder(stream,{mimeType:mime});
    rec.recorder.ondataavailable=e=>{ if(e.data.size) rec.chunks.push(e.data); };
    rec.recorder.onstop=finishRecording;
    rec.recorder.start();
    rec.active=true;
    setRecUI(true);
  }catch(e){
    document.getElementById("recHint").textContent="无法访问麦克风，请检查浏览器权限后重试。";
  }
}
function setRecUI(on){
  const btn=document.getElementById("btnRec"); const hint=document.getElementById("recHint");
  if(btn) btn.classList.toggle("recording", on);
  if(hint) hint.textContent = on ? "正在聆听，请大声跟读……" : "点击按钮，跟读上面的句子";
}
function startRecognition(){
  if(!SR){ return; }
  stopAll();
  rec.active=true;
  setRecUI(true);
  const hint=document.getElementById("recHint");
  if(hint) hint.textContent="准备中，请稍候……";

  const begin=()=>{
    try{
      traceLog=[];
      recognition=new SR();
      recognition.lang=store.settings.accent==="UK"?"en-GB":"en-US";
      recognition.interimResults=false;
      recognition.continuous=false;
      recognition.maxAlternatives=1;
      let got=false;
      let timedOut=false;
      recogTimer=setTimeout(()=>{
        timedOut=true;
        traceEvent("等待超时","warn");
        /* 不主动 stop/abort：iOS 上一旦切断会话，后续可能持续收不到音频；仅复位按钮，让后台会话自然结束 */
        rec.active=false;
        setRecUI(false);
      },8000);

      recognition.onstart=()=>{ rec.active=true; traceEvent("引擎已启动"); if(hint) hint.textContent="正在聆听，请大声跟读……"; };
      recognition.onaudiostart=()=>traceEvent("麦克风已开启");
      recognition.onspeechstart=()=>traceEvent("检测到说话","ok");
      recognition.onspeechend=()=>traceEvent("说话结束");
      recognition.onresult=e=>{
        got=true;
        if(recogTimer){ clearTimeout(recogTimer); recogTimer=null; }
        traceEvent("识别成功","ok");
        applyResult(e.results[0][0].transcript, false);
      };
      recognition.onerror=e=>{
        if(recogTimer){ clearTimeout(recogTimer); recogTimer=null; }
        traceEvent("错误："+e.error+(e.message?"（"+e.message+"）":""), "bad");
        let msg;
        if(e.error==="aborted"){
          msg=timedOut
            ? "8 秒内未检测到语音，会话超时结束；若反复如此，请彻底关闭 Safari 后重开"
            : "识别会话被系统中止；请彻底关闭 Safari 后重开再试";
        }else{
          msg={
            "no-speech":"没有检测到语音，请靠近麦克风再试一次",
            "service-not-allowed":"识别服务被拦截：请在 Safari 中打开，确认已开启「听写」与麦克风权限",
            "audio-capture":"未检测到麦克风设备",
            "network":"识别服务网络异常，请检查网络后重试"
          }[e.error]||("识别失败："+e.error);
        }
        if(hint) hint.textContent=msg;
        if(!got) applyResult("", false);
      };
      recognition.onend=()=>{
        if(recogTimer){ clearTimeout(recogTimer); recogTimer=null; }
        rec.active=false;
        setRecUI(false);
      };
      recognition.start();
    }catch(e){
      rec.active=false;
      if(hint) hint.textContent="识别启动失败，请用 Safari 打开本页面";
    }
  };

  begin();
}
function stopAll(){
  if(rec.recorder && rec.recorder.state==="recording") rec.recorder.stop();
  /* 识别前释放朗读占用的音频会话，避免语音合成未退出导致识别会话被 aborted */
  if("speechSynthesis" in window){ try{ speechSynthesis.cancel(); }catch(e){} }
  /* iOS 27 workaround：不主动 stop/abort 识别会话，切断后该标签页会持续收不到音频 */
  if(recogTimer){ clearTimeout(recogTimer); recogTimer=null; }
  rec.active=false;
}
function finishRecording(){
  rec.active=false;
  setRecUI(false);
  if(rec.url) URL.revokeObjectURL(rec.url);
  const blob=new Blob(rec.chunks,{type:rec.recorder&&rec.recorder.mimeType||"audio/webm"});
  rec.url=URL.createObjectURL(blob);
  if(rec.stream){ rec.stream.getTracks().forEach(t=>t.stop()); rec.stream=null; }
  renderFeedback();
  // 浏览器不支持识别时，给出手动自评入口
  if(!SR && !session.result) renderManualRate();
}
function applyResult(transcript, manual){
  const s=currentSentence();
  if(manual){ session.result={manual:true, score:transcript, transcript:"（手动自评）", align:null, extras:[]}; }
  else{
    const align=alignWords(s.en, transcript);
    session.result={manual:false, transcript:transcript||"", align, score:scoreOf(align)};
  }
  renderFeedback();
}
function renderManualRate(){
  const fb=document.getElementById("feedback");
  if(!fb) return;
  fb.classList.add("show");
  fb.innerHTML=`
    <div class="note-banner" style="margin-bottom:12px">当前浏览器未接入语音识别，可听自己的录音回放后手动评估本次表现。</div>
    <div class="audio-replay">回放录音 <audio controls src="${rec.url||""}"></audio></div>
    <div class="p-actions">
      <button class="btn btn-soft" data-manual="90">读得不错</button>
      <button class="btn btn-soft" data-manual="70">基本可以</button>
      <button class="btn btn-soft" data-manual="50">需要重练</button>
    </div>`;
  fb.querySelectorAll("[data-manual]").forEach(b=>b.addEventListener("click",()=>applyResult(parseInt(b.dataset.manual,10), true)));
}
function renderFeedback(){
  const fb=document.getElementById("feedback");
  if(!fb) return;
  const r=session.result;
  const s=currentSentence();
  // 同步刷新卡片上的词级高亮：标红的是没读准/漏掉的词

  const label=scoreLabel(r.score);

  const matchTxt=r.manual?"手动自评":`匹配 ${r.align.matchCount}/${r.align.target.length} 词`;
  const wrong=store.wrong.includes(s.id);
  fb.classList.add("show");
  fb.innerHTML=`
    <div class="score-ring">
      <div class="score-num" style="color:${color}">${r.score}</div>
      <div class="score-labels">
        <div><b>${label.text}</b></div>
        <div class="muted">${matchTxt}</div>
      </div>
    </div>
    <div class="transcript-box">
      <div class="lbl">你说出的内容</div>
      <div>${esc(r.transcript)||"（未识别到语音，建议先听示范再跟读）"}</div>
    </div>
    ${rec.url?`<div class="audio-replay">回放我的录音 <audio controls src="${rec.url}"></audio></div>`:""}
    <div class="p-actions">
      <button class="btn btn-ghost" id="btnReplay">再听示范</button>
      <button class="btn btn-ghost" id="btnRetry">重录一次</button>
      <button class="btn btn-soft" id="pWrong">${wrong?"移出错题":"加入错题本"}</button>
      <div style="flex:1"></div>
      ${session.index>0?'<button class="btn btn-ghost" id="btnPrev">上一句</button>':""}
      <button class="btn btn-primary" id="btnNext">${session.index<session.list.length-1?"下一句":"完成今日练习"}</button>
    </div>`;
  document.getElementById("btnReplay").addEventListener("click",()=>speak(s.en));
  document.getElementById("btnRetry").addEventListener("click",()=>{ session.result=null; renderPractice(); });
  document.getElementById("pWrong").addEventListener("click",()=>{ toggleWrong(s.id); renderFeedback(); });
  const prev=document.getElementById("btnPrev"); if(prev) prev.addEventListener("click",prevCard);
  document.getElementById("btnNext").addEventListener("click",nextCard);
}
function commitCurrent(){
  const s=currentSentence();
  if(!s||!session.result) return;
  const h=todayHistory();
  h.push({id:s.id, score:session.result.score, ts:Date.now()});
  store.history[todayKey()]=h;
  if(session.result.score<60 && !store.wrong.includes(s.id)) store.wrong.push(s.id);
  saveStore();
}
function nextCard(){
  commitCurrent();
  if(session.index<session.list.length-1){ session.index++; session.result=null; renderPractice(); }
  else{ navigate("home"); }
}
function prevCard(){ if(session.index>0){ commitCurrent(); session.index--; session.result=null; renderPractice(); } }

function collectExport(scope){
  if(scope==="fav") return store.fav.map(findSentence).filter(Boolean);
  if(scope==="wrong") return store.wrong.map(findSentence).filter(Boolean);
  if(scope==="today") return todayHistory().map(h=>findSentence(h.id)).filter(Boolean);
  return allSentences();
}
function csvQ(v){ v=String(v==null?"":v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function toTXT(items){
  return items.map((s,i)=>`${i+1}. ${s.en}\n   释义：${s.zh}${s.source?"\n   出处："+s.source:""}${s.note?"\n   发音："+s.note:""}`).join("\n\n");
}
function toCSV(items){
  const head="id,english,chinese,category,level,note";
  const rows=items.map(s=>[s.id,csvQ(s.en),csvQ(s.zh),s.cat,s.level,csvQ(s.note||"")].join(","));
  return "\uFEFF"+[head].concat(rows).join("\n");
}
function toMD(items){
  return ["# 口语练习例句导出","", "| 英文 | 中文 | 分类 | 难度 |","|---|---|---|---|"]
    .concat(items.map(s=>`| ${String(s.en).replace(/\|/g,"/")} | ${String(s.zh).replace(/\|/g,"/")} | ${(CAT_META[s.cat]||{}).label||s.cat} | ${s.level||""} |`))
    .join("\n");
}
function downloadFile(name, content, mime){
  const blob=new Blob([content],{type:mime});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
}
function parseImport(text){
  const trimmed=text.trim();
  if(!trimmed) return [];
  let arr;
  if(trimmed.startsWith("[")){ arr=JSON.parse(trimmed); }
  else{
    arr=trimmed.split(/\n+/).filter(Boolean).map(line=>{
      const parts=line.split("|").map(x=>x.trim());
      return {en:parts[0]||"",zh:parts[1]||"",level:parts[2]||"",cat:parts[3]||""};
    });
  }
  const out=[];
  arr.forEach((s,i)=>{
    if(!s.en) return;
    out.push({
      id:"imp-"+Date.now()+"-"+i,
      kind:s.kind==="passage"?"passage":"sentence",
      en:s.en, zh:s.zh||"",
      cat:CAT_META[s.cat]?s.cat:"daily",
      level:LEVEL_META[s.level]?s.level:"B1",
      tags:s.tags||[], note:s.note||"", source:s.source||""
    });
  });
  return out;
}

  // 导出
  view.querySelectorAll("[data-exp]").forEach(b=>b.addEventListener("click",()=>{
    const items=collectExport(document.getElementById("expScope").value);
    if(!items.length){ alert("当前范围没有可导出的内容。"); return; }
    const fmt=b.dataset.exp;
    const content=fmt==="csv"?toCSV(items):fmt==="md"?toMD(items):toTXT(items);
    const mime=fmt==="csv"?"text/csv;charset=utf-8":fmt==="md"?"text/markdown;charset=utf-8":"text/plain;charset=utf-8";
    downloadFile("口语例句-"+todayKey()+"."+fmt, content, mime);
  }));
  document.getElementById("expCopy").addEventListener("click",async()=>{
    const items=collectExport(document.getElementById("expScope").value);
    if(!items.length){ alert("当前范围没有可复制的内容。"); return; }
    const content=toTXT(items);
    try{ await navigator.clipboard.writeText(content); alert("已复制到剪贴板。"); }
    catch(e){ alert("复制失败，请改用导出文件。"); }
  });

  // 导入
  const fileInput=document.getElementById("importFile");
  fileInput.addEventListener("change",e=>{
    const f=e.target.files[0]; if(!f) return;
    const reader=new FileReader();
    reader.onload=()=>{ document.getElementById("importText").value=reader.result; };
    reader.readAsText(f);
  });
  document.getElementById("btnImport").addEventListener("click",()=>{
    const msg=document.getElementById("importMsg");
    let arr;
    try{ arr=parseImport(document.getElementById("importText").value); }
    catch(e){ msg.textContent="解析失败：JSON 格式有误。"; msg.style.color="var(--bad)"; return; }
    if(!arr.length){ msg.textContent="没有可导入的句子。"; msg.style.color="var(--bad)"; return; }
    const existing=new Set(allSentences().map(s=>s.en));
    const fresh=arr.filter(s=>!existing.has(s.en));
    store.imported=store.imported.concat(fresh);
    saveStore();
    msg.textContent=`成功导入 ${fresh.length} 句${fresh.length<arr.length?"，"+(arr.length-fresh.length)+" 句重复已跳过":""}。`;
    msg.style.color="var(--ok)";
    document.getElementById("importText").value="";
  });

  // 设置
  document.getElementById("setAccent").addEventListener("change",e=>{ store.settings.accent=e.target.value; saveStore(); });
  document.getElementById("setRate").addEventListener("change",e=>{ store.settings.rate=parseFloat(e.target.value); saveStore(); });

  // 数据管理
  document.getElementById("btnClearRecord").addEventListener("click",()=>{
    if(!confirm("确定清空全部练习记录、错题与打卡统计吗？收藏保留。")) return;
    store.history={}; store.wrong=[]; store.minutes={}; saveStore(); render();
  });
  document.getElementById("btnClearAll").addEventListener("click",()=>{
    if(!confirm("确定恢复出厂？收藏、导入的例句和全部记录都会被清除。")) return;
    localStorage.removeItem(STORE_KEY); store=loadStore(); saveStore(); render();
  });
}

/* ==================== 初始化 ==================== */
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>navigate(t.dataset.route)));

// 从 Supabase records 表拉取全量句子，把 data 字段展开成扁平条目
async function fetchCorpus(){
  const { data, error } = await supabase.from('records').select('*').order('id');
  if (error) throw error;
  return (data || []).map((row) => {
    const d = (row && row.data) || {};
    return { ...d, id: d.id || String(row.id) };
  }).filter((s) => s.en);
}

async function boot(){
  // 学习状态仅存浏览器本地（本次不做云端进度同步）
  store = loadStore();
  // 从 Supabase 拉取全量词库
  try{
    RAW_DATA = await fetchCorpus();
  }catch(e){
    console.error("加载语料失败：", e);
  }
  render();
}
boot();
