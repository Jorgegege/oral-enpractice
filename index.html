<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#2F6B5E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="口语教练" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />
<title>英语口语教练 · 跟读练发音</title>
<style>
:root{
  --bg:#E9F3EC; --bg-soft:#D8E9DD; --card:#FFFFFF; --ink:#1B2620;
  --ink-2:#5C6B62; --ink-3:#8A988F;
  --line:#D3E5D9;
  --primary:#2F6B5E; --primary-deep:#235247; --primary-soft:#E2F0E8;
  --ok:#3E8E6E; --ok-soft:#E4F1EB;
  --warn:#D9A441; --warn-soft:#F7EDD8;
  --bad:#C25B4E; --bad-soft:#F8E7E4;
  --accent:#3E7CB1; --accent-soft:#E4EEF7;
  --radius:16px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(30,36,32,.06),0 6px 18px rgba(30,36,32,.07);
  --font-sans:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --font-en:Georgia,"Times New Roman",var(--font-sans);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-sans);background:var(--bg);color:var(--ink);
  line-height:1.6;font-size:16px;
  -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);
  overscroll-behavior-y:none;
}
#app{max-width:680px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
.en{font-family:var(--font-en);letter-spacing:.2px;}

/* ===== 顶栏 ===== */
header{
  position:sticky;top:0;z-index:30;
  background:linear-gradient(135deg,var(--primary),var(--primary-deep));
  color:#fff;padding:14px 18px 12px;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  box-shadow:0 2px 10px rgba(35,82,71,.18);
}
header .row{display:flex;align-items:center;justify-content:space-between;}
header .brand{font-size:19px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:8px;}
header .brand .dot{width:9px;height:9px;border-radius:50%;background:#BFE3D2;box-shadow:0 0 0 3px rgba(191,227,210,.35);}
header .sub{font-size:12.5px;opacity:.85;margin-top:2px;}
header .date-pill{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);padding:5px 11px;border-radius:20px;font-size:12.5px;font-weight:600;white-space:nowrap;}

/* ===== 主区 ===== */
main{flex:1;padding:16px 16px 90px;overflow-x:hidden;}
.section-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;margin:20px 2px 10px;color:var(--primary-deep);}
.section-title .count{font-size:12px;font-weight:600;color:var(--ink-3);background:var(--primary-soft);padding:1px 8px;border-radius:10px;}
.section-title .sp{flex:1;}
.hint-line{font-size:12.5px;color:var(--ink-3);margin:4px 2px 10px;}

/* ===== 卡片 ===== */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 15px;margin-bottom:12px;border:1px solid var(--line);}
.card.tap{cursor:pointer;transition:transform .08s ease,box-shadow .12s ease;}
.card.tap:active{transform:scale(.995);}
.sentence-en{font-family:var(--font-en);font-size:17.5px;line-height:1.55;color:var(--ink);}
.sentence-zh{font-size:14px;color:var(--ink-2);margin-top:6px;}
.meta-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:9px;}
.badge{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--primary-soft);color:var(--primary-deep);}
.badge.news{background:var(--accent-soft);color:var(--accent);}
.badge.literature{background:var(--warn-soft);color:#9A6B1E;}
.badge.onthisday{background:#EEE9F5;color:#6B5CA5;}
.badge.quote{background:var(--bad-soft);color:#9A4A3E;}
.badge.sub{background:#FDE8EF;color:#B23A68;}
.badge.level{background:#F1F3F2;color:var(--ink-3);}
.src{font-size:11.5px;color:var(--ink-3);margin-top:6px;}
.prac-btn{margin-left:auto;flex:0 0 auto;background:var(--primary);color:#fff;border:none;font-size:13.5px;font-weight:600;padding:7px 15px;border-radius:22px;cursor:pointer;font-family:var(--font-sans);}
.prac-btn:active{background:var(--primary-deep);}
.prac-btn.done{background:var(--ok);}
.done-mark{font-size:11.5px;color:var(--ok);font-weight:600;}

/* ===== 底部 Tab ===== */
nav.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:rgba(255,255,255,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  display:flex;justify-content:space-around;
  padding:6px 4px calc(8px + var(--safe-b));
  box-shadow:0 -2px 14px rgba(30,36,32,.06);
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;background:none;border:none;cursor:pointer;color:var(--ink-3);font-family:var(--font-sans);}
.tab .ico{font-size:21px;line-height:1;}
.tab .lbl{font-size:11px;font-weight:600;}
.tab.active{color:var(--primary);}
.tab.active .lbl{font-weight:700;}

/* ===== 进度条 ===== */
.progress-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow);margin-bottom:4px;}
.progress-head{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);margin-bottom:8px;}
.progress-head b{color:var(--primary-deep);}
.bar{height:9px;border-radius:6px;background:var(--bg-soft);overflow:hidden;}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#4E9C88);border-radius:6px;transition:width .4s ease;}

/* ===== 单词模块 ===== */
.word-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.word-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 12px;box-shadow:var(--shadow);}
.word-card .w{font-family:var(--font-en);font-size:18px;font-weight:700;color:var(--ink);}
.word-card .ipa{font-size:13px;color:var(--accent);margin-top:2px;}
.word-card .zh{font-size:12.5px;color:var(--ink-2);margin-top:3px;min-height:18px;}
.word-card .wrow{display:flex;align-items:center;gap:6px;}
.icon-btn{border:none;background:var(--primary-soft);color:var(--primary-deep);width:28px;height:28px;border-radius:50%;font-size:14px;cursor:pointer;flex:0 0 auto;}
.icon-btn:active{background:var(--primary);color:#fff;}
.word-check{margin-left:auto;font-size:12.5px;color:var(--ink-3);background:none;border:1px solid var(--line);border-radius:14px;padding:3px 10px;cursor:pointer;font-family:var(--font-sans);}
.word-check.on{background:var(--ok-soft);color:var(--ok);border-color:var(--ok);font-weight:600;}

/* ===== 跟读练习弹层 ===== */
#practiceRoot{position:fixed;inset:0;z-index:60;display:none;}
#practiceRoot.show{display:block;}
.prac-sheet{position:absolute;inset:0;background:var(--bg);overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 120px;}
.prac-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.prac-top .t{font-size:17px;font-weight:700;color:var(--primary-deep);}
.close-btn{border:none;background:var(--card);width:34px;height:34px;border-radius:50%;font-size:17px;cursor:pointer;color:var(--ink-2);box-shadow:var(--shadow);}
.prac-sentence{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 16px;margin-bottom:14px;}
.prac-sentence .en-line{font-family:var(--font-en);font-size:21px;line-height:1.6;}
.prac-sentence .zh-line{font-size:14.5px;color:var(--ink-2);margin-top:8px;}
.wtok{display:inline-block;padding:1px 2px;border-radius:4px;transition:background .2s;}
.wtok.match{background:var(--ok-soft);color:var(--ok);font-weight:600;}
.wtok.miss{background:var(--bad-soft);color:var(--bad);text-decoration:underline wavy var(--bad) 1.5px;}
.wtok.current{box-shadow:0 0 0 2px var(--accent);}

.ctl-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.ctl{flex:1;min-width:120px;border:none;border-radius:var(--radius-sm);padding:13px 10px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--font-sans);color:#fff;background:var(--primary);display:flex;align-items:center;justify-content:center;gap:7px;}
.ctl:active{filter:brightness(.95);}
.ctl.listen{background:var(--accent);}
.ctl.rec{background:var(--bad);}
.ctl.stop{background:var(--ink-3);}
.ctl.ghost{background:var(--card);color:var(--primary-deep);border:1.5px solid var(--line);}
.mic-pulse{width:12px;height:12px;border-radius:50%;background:#fff;display:inline-block;animation:pulse 1s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.6)}100%{box-shadow:0 0 0 10px rgba(255,255,255,0)}}

.interim{background:var(--card);border:1.5px dashed var(--line);border-radius:var(--radius-sm);padding:10px 13px;font-size:14.5px;color:var(--ink-2);margin-bottom:12px;display:none;font-family:var(--font-en);min-height:20px;}
.interim.show{display:block;}

/* 评分 */
.result{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;display:none;}
.result.show{display:block;}
.score-head{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
.score-ring{--p:0;width:74px;height:74px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--bg-soft) 0);}
.score-ring > i{width:58px;height:58px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:22px;font-weight:800;color:var(--primary-deep);}
.score-ring.warn{background:conic-gradient(var(--warn) calc(var(--p)*1%),var(--bg-soft) 0);}
.score-ring.bad{background:conic-gradient(var(--bad) calc(var(--p)*1%),var(--bg-soft) 0);}
.score-label{font-size:15px;font-weight:700;}
.score-sub{font-size:12.5px;color:var(--ink-3);margin-top:2px;}

/* 问题词 / 音素反馈 */
.phon-issues{margin-top:12px;}
.phon-title{font-size:13.5px;font-weight:700;color:var(--ink-2);margin:6px 0 8px;}
.phon-item{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;}
.phon-item .pw{font-family:var(--font-en);font-size:16px;font-weight:700;color:var(--bad);}
.phon-item .heard{font-size:12.5px;color:var(--ink-3);margin-top:2px;}
.phon-item .heard b{color:var(--ink-2);}
.ipa-diff{font-family:var(--font-en);font-size:15px;margin-top:6px;letter-spacing:1px;}
.ipa-diff .ph{padding:0 1px;border-radius:3px;}
.ipa-diff .ph.bad-ph{background:var(--bad-soft);color:var(--bad);font-weight:700;}
.ipa-diff .ph.good-ph{color:var(--ink-2);}
.tip{font-size:12.5px;color:var(--primary-deep);background:var(--primary-soft);border-radius:8px;padding:7px 10px;margin-top:7px;line-height:1.5;}
.tip .k{font-weight:700;}
.no-issue{font-size:13.5px;color:var(--ok);background:var(--ok-soft);border-radius:8px;padding:9px 12px;margin-top:8px;}

/* ===== 库 / 筛选 ===== */
.filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--ink-2);font-size:13px;font-weight:600;padding:6px 14px;border-radius:20px;cursor:pointer;font-family:var(--font-sans);white-space:nowrap;}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff;}
.search-box{width:100%;border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:10px 13px;font-size:15px;background:var(--card);font-family:var(--font-sans);margin-bottom:12px;outline:none;}
.search-box:focus{border-color:var(--primary);}

/* ===== 统计 ===== */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px;}
.stat-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;text-align:center;border:1px solid var(--line);}
.stat-card .num{font-size:30px;font-weight:800;color:var(--primary-deep);font-family:var(--font-en);}
.stat-card .lab{font-size:12.5px;color:var(--ink-3);margin-top:3px;}

/* ===== 设置 / 更多 ===== */
.set-group{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:14px;overflow:hidden;}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:14px 15px;border-bottom:1px solid var(--line);font-size:15px;}
.set-row:last-child{border-bottom:none;}
.set-row .desc{font-size:12px;color:var(--ink-3);margin-top:2px;}
.seg{display:flex;background:var(--bg-soft);border-radius:9px;padding:3px;gap:3px;}
.seg button{border:none;background:none;padding:6px 13px;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer;font-family:var(--font-sans);}
.seg button.on{background:var(--card);color:var(--primary-deep);box-shadow:0 1px 3px rgba(0,0,0,.08);}
input[type=range]{width:110px;accent-color:var(--primary);}

/* 字幕导入 */
.import-area{width:100%;min-height:120px;border:1.5px dashed var(--line);border-radius:var(--radius-sm);padding:12px;font-size:14px;font-family:monospace;background:var(--bg);resize:vertical;outline:none;line-height:1.5;}
.file-row{display:flex;gap:10px;margin:10px 0;}
.file-row button{flex:1;border:1.5px solid var(--primary);background:var(--primary-soft);color:var(--primary-deep);font-weight:700;padding:11px;border-radius:var(--radius-sm);font-size:14.5px;cursor:pointer;font-family:var(--font-sans);}
.alert{font-size:13px;border-radius:9px;padding:9px 12px;margin:10px 0;display:none;}
.alert.show{display:block;}
.alert.ok{background:var(--ok-soft);color:var(--ok);}
.alert.err{background:var(--bad-soft);color:var(--bad);}
.alert.info{background:var(--accent-soft);color:var(--accent);}

.empty{text-align:center;color:var(--ink-3);padding:40px 20px;font-size:14px;}
.empty .e-ico{font-size:40px;margin-bottom:10px;opacity:.6;}

/* 加载 */
.loading{text-align:center;padding:50px 0;color:var(--ink-3);font-size:14px;}
.spinner{width:28px;height:28px;border:3px solid var(--bg-soft);border-top-color:var(--primary);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.fade-in{animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:24px;font-size:13.5px;z-index:80;box-shadow:0 4px 16px rgba(0,0,0,.2);opacity:0;transition:opacity .2s;pointer-events:none;max-width:82%;text-align:center;}
.toast.show{opacity:.95;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="row">
      <div>
        <div class="brand"><span class="dot"></span>英语口语教练</div>
        <div class="sub" id="headerSub">跟读 · 逐词纠音 · 每日更新</div>
      </div>
      <div class="date-pill" id="headerDate">—</div>
    </div>
  </header>
  <main id="view"><div class="loading"><div class="spinner"></div>加载中…</div></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<!-- 跟读练习弹层 -->
<div id="practiceRoot"></div>
<!-- 轻提示 -->
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
 * 英语口语教练 · 单文件应用
 * 数据：data/today-<date>.json / data/corpus.json / data/words.json
 * 无 Supabase，纯静态 + localStorage
 * ============================================================ */

// ---------- 工具 ----------
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function localDateStr(d=new Date()){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}
function shiftDate(dateStr, days){
  const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+days); return localDateStr(d);
}
function fmtDateCN(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  return `${d.getMonth()+1}月${d.getDate()}日 · 周${'日一二三四五六'[d.getDay()]}`;
}
const wordCount = s => String(s||'').trim().split(/\s+/).filter(Boolean).length;
let toastTimer=null;
function toast(msg, ms=1900){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'), ms);
}

// ---------- 本地状态 ----------
const LS_KEY='esc-store-v2';
const store = {
  settings:{ accent:'US', rate:0.95, showZh:true, autoStop:true },
  progress:{},      // id -> {score, ts}
  mistakes:[],      // 需复习的 id（保留最近 60）
  wordsDone:{},     // date -> [w]
  imported:[],      // 字幕导入句
};
function loadStore(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){ const s=JSON.parse(raw); Object.assign(store, s); Object.assign(store.settings, s.settings||{}); }
  }catch(e){ console.warn('store 读取失败', e); }
}
function saveStore(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }catch(e){} }
function markProgress(id, score){
  store.progress[id]={ score, ts:Date.now() };
  if(score<70 && !store.mistakes.includes(id)){ store.mistakes.push(id); if(store.mistakes.length>60) store.mistakes.shift(); }
  if(score>=85){ const i=store.mistakes.indexOf(id); if(i>=0) store.mistakes.splice(i,1); }
  saveStore();
}
function isDone(id){ const p=store.progress[id]; return p && p.score>=85; }

// ---------- 数据 ----------
let DB={ today:null, corpus:[], words:[], wordMap:{}, wordsByIpa:[] };
async function fetchJSON(url, cacheKey){
  const cached=()=>{ try{ return JSON.parse(localStorage.getItem(cacheKey)); }catch(e){ return null; } };
  const c0=cached();
  try{
    const r=await fetch(url, {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(Array.isArray(j)||j&&typeof j==='object'){ try{ localStorage.setItem(cacheKey, JSON.stringify(j)); }catch(e){} return j; }
    throw new Error('bad json');
  }catch(e){
    if(c0) { console.warn('fetch '+url+' 失败，用缓存：'+e.message); return c0; }
    throw e;
  }
}
async function loadToday(){
  const today=localDateStr();
  for(let k=0;k<3;k++){
    const d=shiftDate(today,-k);
    try{ const j=await fetchJSON('data/today-'+d+'.json','esc-today-'+d); if(j && j.short) return j; }catch(e){}
  }
  return null;
}
function normText(s){
  return String(s||'').toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9'\s]/g,' ').replace(/\s+/g,' ').trim();
}
function djb2(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return h; }
function mulberry32(seed){ let a=seed>>>0; return function(){ a|=0;a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function seededShuffle(arr,rng){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// 本地兜底生成（Actions 未跑 / 断网时）
function localGeneratePlan(corpus, words, dateStr){
  const rng=mulberry32(djb2('plan-'+dateStr));
  const shortPool=seededShuffle(corpus.filter(x=>x.en&&wordCount(x.en)>=4&&wordCount(x.en)<=22), rng);
  const longPool=seededShuffle(corpus.filter(x=>x.en&&wordCount(x.en)>=30), rng);
  const short=shortPool.slice(0,20);
  const long=longPool.slice(0,Math.min(3,Math.max(2,longPool.length)));
  const ipaWords=words.filter(w=>w.i);
  const dayIndex=Math.floor(Date.parse(dateStr+'T00:00:00Z')/86400000);
  const offset=(((dayIndex%ipaWords.length)+ipaWords.length)%ipaWords.length)||0;
  const nw=[]; for(let k=0;k<10&&ipaWords.length;k++) nw.push(ipaWords[(offset+k)%ipaWords.length]);
  return { date:dateStr, generatedAt:new Date().toISOString(), local:true,
    short, long, words:nw,
    meta:{ shortCount:short.length, shortTotalWords:short.reduce((a,s)=>a+wordCount(s.en),0), longCount:long.length, newWords:nw.length } };
}

// ---------- 语音识别 + 词级对齐 + 音素反馈 ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
function normalizeWords(text){
  return (text||'').toLowerCase().replace(/[^a-z0-9' \-]/g,' ').replace(/['\-]/g,' ').trim().split(/\s+/).filter(Boolean);
}
// 顺序对齐：原句每词 match/miss + 多出的 extra
function alignWords(targetText, recognizedText){
  const t=normalizeWords(targetText), r=normalizeWords(recognizedText);
  const res=t.map(w=>({word:w, state:'miss'}));
  const extras=[]; let j=0;
  for(let i=0;i<t.length;i++){
    if(j<r.length && t[i]===r[j]){ res[i].state='match'; j++; continue; }
    const k=r.indexOf(t[i], j);
    if(k>-1){ for(let x=j;x<k;x++) extras.push(r[x]); j=k+1; res[i].state='match'; }
    else res[i].state='miss';
  }
  for(let x=j;x<r.length;x++) extras.push(r[x]);
  return {target:res, extras, matchCount:res.filter(x=>x.state==='match').length};
}
const scoreOf = a => a.target.length? Math.round(a.matchCount/a.target.length*100):0;
function scoreLabel(s){
  if(s>=85) return {text:'发音不错，继续保持', cls:'ok'};
  if(s>=70) return {text:'基本到位，个别词再练练', cls:'warn'};
  if(s>=50) return {text:'有几处没读准，建议重练', cls:'warn'};
  return {text:'差距较大，先听示范再尝试', cls:'bad'};
}

// -- IPA 处理 --
const DIGRAPHS=['tʃ','dʒ'];
function tokenizeIpa(s){
  s=String(s||''); const toks=[]; let i=0;
  while(i<s.length){
    let hit=false;
    for(const dg of DIGRAPHS){ if(s.startsWith(dg,i)){ toks.push(dg); i+=dg.length; hit=true; break; } }
    if(hit) continue;
    const ch=s[i];
    if(ch==='ː' && toks.length){ toks[toks.length-1]+= 'ː'; i++; continue; } // 长音并入前一元音
    toks.push(ch); i++;
  }
  return toks;
}
const ipaForDiff = s => tokenizeIpa(s).filter(t=>t!=='ˈ'&&t!=='ˌ');
// LCS 对齐，返回目标音素的操作：keep / del(用户漏读)
function ipaOps(target, heard){
  const a=ipaForDiff(target), b=ipaForDiff(heard);
  const n=a.length,m=b.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--) dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const ops=[]; let i=0,j=0;
  while(i<n&&j<m){ if(a[i]===b[j]){ops.push({op:'keep',ph:a[i]});i++;j++;} else if(dp[i+1][j]>=dp[i][j+1]){ops.push({op:'del',ph:a[i]});i++;} else {ops.push({op:'ins',ph:b[j]});j++;} }
  while(i<n){ops.push({op:'del',ph:a[i]});i++;}
  return {a, ops, delCount:ops.filter(o=>o.op==='del').length};
}
// 词形还原（找音标用）
function stemForms(w){
  w=String(w||'').toLowerCase().replace(/[^a-z-]/g,'');
  const f=[w];
  if(w.endsWith('ies')) f.push(w.slice(0,-3)+'y');
  if(w.endsWith('es')&&!w.endsWith('ss')) f.push(w.slice(0,-2));
  if(w.endsWith('s')&&!w.endsWith('ss')&&w.length>2) f.push(w.slice(0,-1));
  if(w.endsWith('ed')) f.push(w.slice(0,-2),w.slice(0,-1));
  if(w.endsWith('ing')) f.push(w.slice(0,-3),w.slice(0,-4));
  return f.filter(Boolean);
}
function ipaOf(w){
  for(const f of stemForms(w)){ const e=DB.wordMap[f]; if(e&&e.i) return e.i; }
  return '';
}
// 中式发音高危音素提示
const PHONEME_HINTS={
  'θ':'<span class="k">/θ/ 轻 th</span>：舌尖轻咬上齿缝送气，别读成 /s/ 或 /t/',
  'ð':'<span class="k">/ð/ 重 th</span>：舌尖咬齿缝并振动声带，别读成 /z/ 或 /d/',
  'ʃ':'<span class="k">/ʃ/ sh</span>：气流卷起往后，别读成 /s/',
  'ʒ':'<span class="k">/ʒ/」vision 的 zh</span>：卷舌气流+振动声带',
  'ɜ':'<span class="k">/ɜː/ bird 的 e</span>：舌居中部不圆唇，别读成 /e/ 或 /u/',
  'ə':'<span class="k">/ə/ 中央元音</span>：放松发"呃"，最常见弱读',
  'v':'<span class="k">/v/</span>：上齿咬下唇振动，别读成 /w/',
  'b':'<span class="k">/b/</span>：双唇闭合弹开无摩擦，与 /v/ 区分',
  'l':'<span class="k">词尾 /l/</span>：舌根后顶硬腭，别补成"哦"',
  'r':'<span class="k">词尾 /r/</span>：舌身往后缩卷，别读成 /l/',
  'ŋ':'<span class="k">词尾 /ŋ/ ng</span>：舌根抵软腭，别加 g 音',
  'k':'<span class="k">词尾 /k/</span>：短促收尾，别补元音',
  't':'<span class="k">词尾 /t/</span>：短促轻送气，别补元音',
  'p':'<span class="k">词尾 /p/</span>：短促收尾，别补元音',
  's':'<span class="k">词尾 /s/</span>：短促收尾，别补元音',
  'æ':'<span class="k">/æ/</span>：张大嘴前伸，别读成 /e/',
  'ɪ':'<span class="k">短 /ɪ/</span>：比长 /iː/ 短而松',
  'ɛ':'<span class="k">/ɛ/ e</span>：前元音，嘴角略展开',
  'ɔ':'<span class="k">/ɔː/ o</span>：圆唇后元音',
  'ʊ':'<span class="k">短 /ʊ/</span>：比长 /uː/ 短，双唇略圆',
  'w':'<span class="k">/w/</span>：双唇收圆后弹开，别读成 /v/',
};
// 针对整词的补充高危特征提示
function wordLevelTips(ipa){
  const tips=[];
  const s=ipa||'';
  if(/θ|ð/.test(s)) tips.push('这个词含 <b>th</b>：一定把舌尖伸到上下齿之间');
  if(/ɜː|ɜ/.test(s)) tips.push('含 <b>bird 的 e</b>：舌头放中间，不要圆唇');
  if(/v/.test(s)) tips.push('含 <b>v</b>：上牙轻咬下唇，不要读成 w');
  if(/l$/.test(s)) tips.push('词尾是 <b>l</b>：舌根后顶，别补元音');
  if(/r$/.test(s)) tips.push('词尾是 <b>r</b>：舌头后缩卷起，别读成 l');
  if(/(aɪ|eɪ|ɔɪ|aʊ|oʊ|eə|ɪə|ʊə)/.test(s)) tips.push('含<b>双元音</b>：要滑向第二个音，别读成单元音');
  if(/[ktpsg]$/.test(s)) tips.push('词尾<b>辅音</b>要短促，不要拖出元音');
  return tips;
}
// 汇总一个读错词的反馈
function buildWordFeedback(word, heardWord){
  const targetIpa=ipaOf(word);
  const heardIpa=heardWord?ipaOf(heardWord):'';
  let badPhs=[], tips=[];
  if(targetIpa && heardIpa && targetIpa!==heardIpa){
    const {ops}=ipaOps(targetIpa, heardIpa);
    for(const o of ops) if(o.op==='del') badPhs.push(o.ph);
  } else if(targetIpa){
    // 没识别到对应词 → 标出该词的高危音素（取 th/ð/v/ɜ 等）
    for(const t of tokenizeIpa(targetIpa)){ if(PHONEME_HINTS[t]) badPhs.push(t); }
  }
  badPhs=[...new Set(badPhs)].slice(0,4);
  // 提示：优先音素提示，再补整词特征
  for(const ph of badPhs){ if(PHONEME_HINTS[ph] && !tips.some(t=>t.includes(ph))) tips.push(PHONEME_HINTS[ph]); }
  const wt=wordLevelTips(targetIpa);
  for(const t of wt){ if(!tips.some(x=>x.includes(t.slice(0,8)))) tips.push(t); }
  tips=tips.slice(0,3);
  return {targetIpa, heardIpa, badPhs, tips};
}
function renderIpaDiff(targetIpa, badPhs){
  if(!targetIpa) return '';
  const bad=new Set(badPhs);
  return tokenizeIpa(targetIpa).map(ph=>{
    if(ph==='ˈ'||ph==='ˌ') return `<span class="ph good-ph">${esc(ph)}</span>`;
    const isBad = bad.has(ph) || bad.has(ph.replace('ː',''));
    return `<span class="ph ${isBad?'bad-ph':'good-ph'}">${esc(ph)}</span>`;
  }).join('');
}

// 识别会话
let recog=null, recogTimer=null, recogFinal='';
function startRecognition(targetText, onFinal, onInterim){
  if(!SR){ toast('不支持语音识别：请开启 设置 › 通用 › 键盘 › 听写，并添加"英语(美国)"', 3200); return null; }
  if(recog){ try{ recog.abort(); }catch(e){} }
  recogFinal='';
  recog=new SR();
  recog.lang = (store.settings.accent==='UK')?'en-GB':'en-US';
  recog.interimResults=true;
  recog.maxAlternatives=1;
  recog.onresult=(e)=>{
    let interim='', final='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal) final+=t; else interim+=t;
    }
    if(final) recogFinal=final;
    if(interim) onInterim && onInterim(interim);
  };
  recog.onend=()=>{ onFinal && onFinal(recogFinal || recog._lastInterim || ''); };
  recog.onerror=(e)=>{ console.warn('recognition error', e.error); };
  try{ recog.start(); }catch(e){ toast('启动识别失败，请重试'); return null; }
  // 超时：随词数缩放（每词 ~0.9s + 3s 缓冲），可手动停止
  const words=wordCount(targetText);
  const limitMs = Math.max(6000, Math.min(20000, 3000 + words*900));
  if(store.settings.autoStop){
    recogTimer=setTimeout(()=>{ try{ recog.stop(); }catch(e){} }, limitMs);
  }
  return recog;
}
function stopRecognition(){ if(recogTimer){ clearTimeout(recogTimer); recogTimer=null; } if(recog){ try{ recog.stop(); }catch(e){} } }

function evaluate(s, finalText){
  const align=alignWords(s.en, finalText);

  const enEl=$('#pracEn');

  // 问题词：miss 的词 + 尽量匹配识别到的相近词
  const missed=align.target.filter(t=>t.state==='miss');
  const rWords=normalizeWords(finalText);
  const issues=[];
  for(const m of missed){

    const fb=buildWordFeedback(m.word, heard);

    <div class="score-head">

      ? `<div class="no-issue">✓ 全部单词都读到了，发音很完整！</div>`
      : `<div class="phon-issues">
          <div class="phon-title">重点纠正（${Math.min(issues.length,4)} 处）</div>
          ${issues.slice(0,4).map(it=>`
            <div class="phon-item">
              <div class="pw">${esc(it.word)}</div>
              ${it.heard?`<div class="heard">你读成了 <b>${esc(it.heard)}</b></div>`:''}
              ${it.targetIpa?`<div class="ipa-diff" title="标准音标">${renderIpaDiff(it.targetIpa, it.badPhs)}</div>`:''}
              ${it.tips.length?`<div class="tip">${it.tips.join('<br>')}</div>`:''}
            </div>`).join('')}
        </div>`}
    <div class="ctl-row" style="margin-top:14px">
      <button class="ctl ghost" id="btnReListen">🔊 再听示范</button>
      <button class="ctl" id="btnFinish">完成 ${isDone(s.id)?'✓':''}</button>
    </div>`;

}
function levenshtein(a,b){
  const m=a.length,n=b.length; if(!m)return n; if(!n)return m;
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ let cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; }
  return prev[n];
}

function currentRoute(){ const h=(location.hash||'#/home').replace('#/',''); return TABS.some(t=>t.id===h)?h:'home'; }
function navigate(r){ location.hash='#/'+r; }
function renderTabbar(){
  const cur=currentRoute();
  $('#tabbar').innerHTML=TABS.map(t=>`<button class="tab ${t.id===cur?'active':''}" data-r="${t.id}"><span class="ico">${t.ico}</span><span class="lbl">${t.lbl}</span></button>`).join('');

}
function render(){

  const view=$('#view');
  view.innerHTML='<div class="loading"><div class="spinner"></div>加载中…</div>';

// -- 今日 --
function sentenceCard(s, opts={}){
  const done=isDone(s.id);
  return `<div class="card tap" data-open="${s.id}">
    <div class="sentence-en">${esc(s.en)}</div>
    ${store.settings.showZh && s.zh?`<div class="sentence-zh">${esc(s.zh)}</div>`:''}
    <div class="meta-row">${badgeHtml(s)}
      <span class="badge level">${wordCount(s.en)} 词</span>
      ${done?'<span class="done-mark">✓ 已达标</span>':''}
      <button class="prac-btn ${done?'done':''}" data-open="${s.id}">${opts.btn||'跟读'}</button>
    </div>
  </div>`;
}
function renderHome(view){
  const t=DB.today; if(!t){ view.innerHTML=emptyHtml('今日计划还没准备好'); return; }
  const doneShort=t.short.filter(isDone).length;
  const doneLong=t.long.filter(isDone).length;
  const doneWords=(store.wordsDone[t.date]||[]).length;
  const pct=Math.round(((doneShort+t.long.length?doneShort:0)+doneLong+doneWords)/(t.short.length+t.long.length+10)*100)||0;
  view.innerHTML=`
    <div class="progress-wrap fade-in">
      <div class="progress-head"><span>今日进度 <b>${doneShort}/${t.short.length} 短句</b> · <b>${doneLong}/${t.long.length} 长句</b> · <b>${doneWords}/${t.words.length} 新词</b></span><b>${pct}%</b></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </div>
    ${t.local?`<div class="hint-line" style="margin-top:10px">⚠️ 当前为本地兜底计划（未取到云端今日文件），仍可正常练习</div>`:''}
    <div class="section-title">📖 今日短句 <span class="count">${t.meta.shortCount} 句 · 共 ${t.meta.shortTotalWords} 词</span></div>
    ${t.short.map(s=>sentenceCard(s)).join('')}
    <div class="section-title">🔥 挑战长句 <span class="count">${t.meta.longCount} 句 · 每句 30+ 词</span></div>

}
function wordCardHtml(w, dateStr){
  const done=(store.wordsDone[dateStr]||[]).includes(w.w);
  return `<div class="word-card">
    <div class="wrow"><span class="w">${esc(w.w)}</span>
      <button class="icon-btn" data-say="${esc(w.w)}" title="听发音">🔊</button>
      <button class="word-check ${done?'on':''}" data-word="${esc(w.w)}" data-date="${dateStr}">${done?'已学 ✓':'标记已学'}</button>
    </div>
    <div class="ipa en">${esc(w.i||'')}</div>
    <div class="zh">${esc(w.z||'')}</div>

}
function bindWordCards(view){
  $$('[data-say]',view).forEach(b=>b.onclick=()=>speakWithBtn(b, b.dataset.say));
  $$('[data-word]',view).forEach(b=>b.onclick=()=>{
    const d=b.dataset.date; store.wordsDone[d]=store.wordsDone[d]||[];
    const i=store.wordsDone[d].indexOf(b.dataset.word);
    if(i>=0) store.wordsDone[d].splice(i,1); else store.wordsDone[d].push(b.dataset.word);
    saveStore(); b.classList.toggle('on', i<0); b.textContent=i<0?'已学 ✓':'标记已学';

}

let libFilter={cat:'all', q:''};
function renderLibrary(view){
  const cats=[...new Set(DB.allSentences.map(s=>s.cat||'daily'))];
  const nameMap={daily:'日常',news:'时政',literature:'名著',onthisday:'同日史',quote:'名言',usshow:'美剧',ukshow:'英剧',animation:'动画',business:'商务',subtitle:'字幕',long:'长句',passage:'篇章'};
  view.innerHTML=`
    <input class="search-box" id="libSearch" placeholder="🔍 搜索句子或单词…" value="${esc(libFilter.q)}" />
    <div class="filter-row" id="libFilter">
      <button class="chip ${libFilter.cat==='all'?'on':''}" data-cat="all">全部 ${DB.allSentences.length}</button>
      ${cats.map(c=>`<button class="chip ${libFilter.cat===c?'on':''}" data-cat="${c}">${nameMap[c]||c} ${DB.allSentences.filter(s=>(s.cat||'daily')===c).length}</button>`).join('')}
    </div>
    <div id="libList"></div>`;
  $('#libSearch').oninput=(e)=>{ libFilter.q=e.target.value.trim(); renderLibList(); };
  $$('#libFilter .chip').forEach(c=>c.onclick=()=>{ libFilter.cat=c.dataset.cat; renderLibrary(view); });
  renderLibList();
}
function renderLibList(){
  const list=$('#libList'); if(!list) return;
  const q=normText(libFilter.q);
  let items=DB.allSentences.filter(s=>{
    if(libFilter.cat!=='all' && (s.cat||'daily')!==libFilter.cat) return false;
    if(q && !normText(s.en).includes(q) && !(s.zh&&s.zh.includes(libFilter.q))) return false;
    return true;
  });
  // 按 id 稳定排序，长句靠后
  items=items.slice().sort((a,b)=> (wordCount(b.en)>=30?1:0)-(wordCount(a.en)>=30?1:0));
  if(!items.length){ list.innerHTML=emptyHtml('没有匹配的句子'); return; }
  list.innerHTML=items.slice(0,120).map(s=>sentenceCard(s)).join('');
  if(items.length>120) list.innerHTML+=`<div class="hint-line">… 还有 ${items.length-120} 句，用搜索精确定位</div>`;
  bindSentenceCards(list);
}

  const practicedDays=new Set(scores.map(p=>new Date(p.ts).toDateString())).size;

    <div class="section-title">📊 学习统计</div>
    <div class="stat-grid">
      <div class="stat-card"><div class="num">${scores.length}</div><div class="lab">累计练习句数</div></div>
      <div class="stat-card"><div class="num">${done}</div><div class="lab">达标句数 (≥85)</div></div>
      <div class="stat-card"><div class="num">${avg}</div><div class="lab">平均得分</div></div>
      <div class="stat-card"><div class="num">${best}</div><div class="lab">最高得分</div></div>
      <div class="stat-card"><div class="num">${practicedDays}</div><div class="lab">练习天数</div></div>

    </div>
    <div class="section-title">📈 最近 7 日练习</div>

    <div class="section-title">📚 句库规模</div>
    <div class="card" style="font-size:14px;color:var(--ink-2)">

      COCA 高频词 <b style="color:var(--primary-deep)">${DB.words.length}</b> 词<br>
      <span style="font-size:12.5px;color:var(--ink-3)">云端每日 06:00（北京时间）自动更新，含时政新闻 / 名著 / 名言 / 同日史</span>

function weekChartHtml(){
  const days=[];
  for(let i=6;i>=0;i--){
    const d=shiftDate(localDateStr(),-i);
    const cnt=Object.values(store.progress).filter(p=>localDateStr(new Date(p.ts))===d).length;
    days.push({d,cnt});
  }
  const max=Math.max(1,...days.map(x=>x.cnt));
  return `<div class="card" style="padding:16px 14px">
    <div style="display:flex;align-items:flex-end;gap:8px;height:120px">
      ${days.map(x=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end">
        <div style="font-size:11px;color:var(--ink-3)">${x.cnt||''}</div>
        <div style="width:70%;max-width:26px;background:${x.cnt?'linear-gradient(180deg,var(--primary),#4E9C88)':'var(--bg-soft)'};border-radius:5px;height:${Math.max(4,x.cnt/max*90)}px"></div>
        <div style="font-size:10.5px;color:var(--ink-3)">${x.d.slice(5).replace('-','/')}</div>
      </div>`).join('')}
    </div></div>`;
}

// 字幕解析
function parseSubtitles(raw, filename){
  const lines=String(raw||'').replace(/\r/g,'').split('\n');
  const out=[]; const seen=new Set();
  let idx=0;
  // SRT / VTT：数字序号 + 时间轴
  for(let i=0;i<lines.length;i++){
    const l=lines[i].trim();
    if(/^\d+$/.test(l)){ // SRT 序号
      // 收集后续非空行（直到空行）
      let texts=[]; let k=i+1;
      while(k<lines.length && !/-->/.test(lines[k])){ if(lines[k].trim()) texts.push(lines[k].trim()); k++; }
      if(k<lines.length && /-->/.test(lines[k])) k++;
      while(k<lines.length && lines[k].trim()){ texts.push(lines[k].trim()); k++; }
      i=k-1;
      const joined=texts.join(' ');
      pushSub(joined, out, seen, filename);
    }
  }
  // ASS：Dialogue: 层,标记,角色,...,文本
  const assLines=lines.filter(l=>/^Dialogue:\s*/i.test(l));
  if(assLines.length){
    for(const l of assLines){
      const parts=l.replace(/^Dialogue:\s*/i,'').split(',');
      const text=parts.slice(9).join(',').replace(/\{[^}]*\}/g,'').trim();
      pushSub(text, out, seen, filename);
    }
  }
  // 若上面没解析到（纯文本/双语每行），逐行处理
  if(!out.length){
    for(const l of lines){
      let t=l.trim().replace(/^[0-9]+\s*/,'').replace(/-->.*$/,'').replace(/\{[^}]*\}/g,'').replace(/<[^>]+>/g,'').trim();
      pushSub(t, out, seen, filename);
    }
  }
  return out;
}
function pushSub(text, out, seen, source){
  if(!text) return;
  // 剥离时间戳/标签残留
  text=text.replace(/\d{2}:\d{2}[:,]\d{2}/g,' ').replace(/\s+/g,' ').trim();
  // 中英分离
  const zh=(text.match(/[\u4e00-\u9fff][\u4e00-\u9fff，。！？、；：""''（）《》\s]*/g)||[]).join('');
  let en=text.replace(/[\u4e00-\u9fff][\u4e00-\u9fff，。！？、；：""''（）《》\s]*/g,' ').replace(/\s+/g,' ').trim();
  const wc=wordCount(en);
  if(wc<3||wc>20) return;
  if(!/^[A-Za-z]/.test(en)) return;
  const id='sub_'+djb2(normText(en)).toString(36).padStart(7,'0').slice(0,7);
  if(seen.has(id)) return; seen.add(id);
  out.push({id, en, zh:zh.trim(), cat:'subtitle', level: wc>=15?'B2':(wc>=10?'B1':'A2'), tags:['字幕'], source:source||'导入'});
}
function doImportSub(view){
  const raw=$('#subText').value.trim();
  const alert=$('#importAlert');
  if(!raw){ alert.className='alert err show'; alert.textContent='请先粘贴字幕或选择文件'; return; }
  const parsed=parseSubtitles(raw, '粘贴字幕');
  if(!parsed.length){ alert.className='alert err show'; alert.textContent='没解析到有效句子（需 3~20 个英文单词/句）。请检查字幕格式。'; return; }
  const before=store.imported.length; const known=new Set(store.imported.map(s=>s.id));
  for(const s of parsed) if(!known.has(s.id)) store.imported.push(s);
  const added=store.imported.length-before;
  saveStore(); DB.allSentences=[...store.imported, ...DB.corpus];
  alert.className='alert ok show'; alert.textContent=`✓ 解析出 ${parsed.length} 句，新增 ${added} 句（已存入句库"字幕"分类）`;
  renderImportedList(view);
  $('#subText').value='';
}
function exportSubs(){
  if(!store.imported.length){ toast('还没有可导出的导入句'); return; }
  const blob=new Blob([JSON.stringify(store.imported,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='imported-sentences-'+localDateStr()+'.json'; a.click();
  toast('已导出 JSON 备份');
}
