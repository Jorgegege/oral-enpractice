<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#6E8F7E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="口语教练" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />
<title>英语口语教练 · 跟读练发音</title>
<script>/* 夜间模式防闪烁：在样式生效前应用主题 */
try{var _s=JSON.parse(localStorage.getItem('esc-store-v2')||'{}');if(_s.settings&&_s.settings.darkMode)document.documentElement.classList.add('dark');}catch(e){}
</script>
<style>
:root{
  /* 莫兰迪绿护眼配色：低饱和、灰调、无纯白纯黑 */
  --bg:#E7EDE6; --bg-soft:#D8E0D6; --card:#FAFBF7; --ink:#2E3A33;
  --ink-2:#5E6D63; --ink-3:#94A096;
  --line:#D4DED3;
  --primary:#6E8F7E; --primary-deep:#506E5F; --primary-soft:#E3EDE5;
  --ok:#7A9C87; --ok-soft:#E7EFE8;
  --warn:#C2A375; --warn-soft:#F4EDDC;
  --bad:#B67E73; --bad-soft:#F2E5E1;
  --accent:#7D9AAE; --accent-soft:#E6EDF2;
  --radius:16px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(46,58,51,.05),0 6px 18px rgba(46,58,51,.06);
  --font-sans:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --font-en:Georgia,"Times New Roman",var(--font-sans);
  --safe-b:env(safe-area-inset-bottom,0px);
}
/* ===== 夜间模式：深色变量覆盖 ===== */
html.dark{
  --bg:#1B211E; --bg-soft:#262E29; --card:#232B26; --ink:#E4EAE5;
  --ink-2:#AEBDB2; --ink-3:#7B8B80;
  --line:#39443D;
  --primary:#6E9380; --primary-deep:#A9C7B4; --primary-soft:#2C3A31;
  --ok:#7FB08F; --ok-soft:#26382C;
  --warn:#C9AC79; --warn-soft:#373122;
  --bad:#C08C81; --bad-soft:#3A2A27;
  --accent:#7D9AAE; --accent-soft:#26333D;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.28);
}
html.dark header{background:linear-gradient(135deg,#2C3A31,#38483E);box-shadow:0 2px 12px rgba(0,0,0,.3);}
html.dark nav.tabbar{background:rgba(35,43,38,.96);}
html.dark .tab .ico .ico-line{filter:brightness(1.9) saturate(.5);opacity:.8;}
html.dark .badge.level{background:var(--bg-soft);color:var(--ink-3);}
html.dark .seg button.on{background:var(--primary);color:#fff;box-shadow:none;}
html.dark .seg{background:var(--bg-soft);}
html.dark .import-area,html.dark input,html.dark textarea{background:var(--bg-soft);color:var(--ink);border-color:var(--line);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-sans);background:var(--bg);color:var(--ink);
  line-height:1.6;font-size:16px;
  -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);
  overscroll-behavior-y:none;
}
#app{max-width:680px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
.en{font-family:var(--font-en);letter-spacing:.2px;}

/* ===== 顶栏 ===== */
header{
  position:sticky;top:0;z-index:30;
  background:linear-gradient(135deg,var(--primary),var(--primary-deep));
  color:#fff;padding:14px 18px 12px;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  box-shadow:0 2px 12px rgba(80,110,95,.16);
}
header .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
header .brand{font-size:19px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:9px;font-family:var(--font-en);}
header .brand .brand-title{font-style:italic;letter-spacing:.5px;}
header .brand .brand-logo{width:30px;height:30px;border-radius:9px;object-fit:cover;flex:0 0 auto;box-shadow:0 1px 4px rgba(0,0,0,.18);}
header .head-sub{font-family:var(--font-en);font-size:12px;opacity:.9;margin-top:2px;letter-spacing:.2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
header .head-user{display:flex;align-items:center;gap:7px;flex:0 0 auto;cursor:pointer;}
header .avatar-btn{width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.18);overflow:hidden;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:18px;padding:0;color:#fff;}
header .uid{font-family:var(--font-en);font-size:14px;font-weight:700;text-align:right;line-height:1.15;}
header .uid .uid-name{display:block;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;}
header .uid .uid-hint{display:block;font-size:10.5px;opacity:.75;font-weight:400;}

/* ===== 主区 ===== */
main{flex:1;padding:16px 16px 90px;overflow-x:hidden;}
.section-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;margin:20px 2px 10px;color:var(--primary-deep);}
.section-title .count{font-size:12px;font-weight:600;color:var(--ink-3);background:var(--primary-soft);padding:1px 8px;border-radius:10px;}
.section-title .sp{flex:1;}
.hint-line{font-size:12.5px;color:var(--ink-3);margin:4px 2px 10px;}

/* ===== 卡片 ===== */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 15px;margin-bottom:12px;border:1px solid var(--line);}
.card.tap{cursor:pointer;transition:transform .08s ease,box-shadow .12s ease;}
.card.tap:active{transform:scale(.995);}
.sentence-en{font-family:var(--font-en);font-size:17.5px;line-height:1.55;color:var(--ink);}
.sentence-zh{font-size:14px;color:var(--ink-2);margin-top:6px;}
.meta-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:9px;}
.badge{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--primary-soft);color:var(--primary-deep);}
.badge.news{background:var(--accent-soft);color:var(--accent);}
.badge.literature{background:var(--warn-soft);color:#9A6B1E;}
.badge.onthisday{background:#EEE9F5;color:#6B5CA5;}
.badge.quote{background:var(--bad-soft);color:#9A4A3E;}
.badge.sub{background:#FDE8EF;color:#B23A68;}
.badge.level{background:#F1F3F2;color:var(--ink-3);}
.src{font-size:11.5px;color:var(--ink-3);margin-top:6px;}
.prac-btn{margin-left:auto;flex:0 0 auto;background:var(--primary);color:#fff;border:none;font-size:13.5px;font-weight:600;padding:7px 15px;border-radius:22px;cursor:pointer;font-family:var(--font-sans);}
.prac-btn:active{background:var(--primary-deep);}
.prac-btn.done{background:var(--ok);}
.done-mark{font-size:11.5px;color:var(--ok);font-weight:600;}

/* ===== 底部 Tab ===== */
nav.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:rgba(255,255,255,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  display:flex;justify-content:space-around;
  padding:6px 4px calc(8px + var(--safe-b));
  box-shadow:0 -2px 14px rgba(30,36,32,.06);
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;background:none;border:none;cursor:pointer;color:var(--ink-3);font-family:var(--font-sans);transition:color .2s;}
.tab .ico{width:34px;height:34px;display:flex;align-items:center;justify-content:center;position:relative;transition:transform .25s cubic-bezier(.34,1.56,.64,1),filter .2s,opacity .2s;}
.tab .ico img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;transition:opacity .25s;}
.tab .ico .ico-line{opacity:.9;}
.tab .ico .ico-color{opacity:0;}
.tab.active .ico .ico-line{opacity:0;}
.tab.active .ico .ico-color{opacity:1;}
.tab .lbl{font-size:11px;font-weight:600;transition:transform .2s;}
.tab:active .ico{transform:scale(.88);}
.tab.active{color:var(--primary-deep);}
.tab.active .lbl{font-weight:700;transform:translateY(-1px);}
.tab.active .ico{transform:translateY(-3px) scale(1.08);animation:tabPop .45s cubic-bezier(.34,1.56,.64,1);}
.tab.active .ico img.ico-color{filter:drop-shadow(0 2px 3px rgba(46,58,51,.18));}
@keyframes tabPop{0%{transform:translateY(2px) scale(.85)}60%{transform:translateY(-5px) scale(1.14)}100%{transform:translateY(-3px) scale(1.08)}}

/* ===== 进度条 ===== */
.progress-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow);margin-bottom:4px;}
.progress-head{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);margin-bottom:8px;}
.progress-head b{color:var(--primary-deep);}
.bar{height:9px;border-radius:6px;background:var(--bg-soft);overflow:hidden;}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#4E9C88);border-radius:6px;transition:width .4s ease;}

/* ===== 单词模块 ===== */
.word-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.word-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 12px;box-shadow:var(--shadow);}
.word-card .w{font-family:var(--font-en);font-size:18px;font-weight:700;color:var(--ink);}
.word-card .ipa{font-size:13px;color:var(--accent);margin-top:2px;}
.word-card .zh{font-size:12.5px;color:var(--ink-2);margin-top:3px;min-height:18px;}
.word-card .wrow{display:flex;align-items:center;gap:6px;}
.icon-btn{border:none;background:var(--primary-soft);color:var(--primary-deep);width:28px;height:28px;border-radius:50%;font-size:14px;cursor:pointer;flex:0 0 auto;}
.icon-btn:active{background:var(--primary);color:#fff;}
.word-check{margin-left:auto;font-size:12.5px;color:var(--ink-3);background:none;border:1px solid var(--line);border-radius:14px;padding:3px 10px;cursor:pointer;font-family:var(--font-sans);}
.word-check.on{background:var(--ok-soft);color:var(--ok);border-color:var(--ok);font-weight:600;}

/* ===== 跟读练习弹层 ===== */
#practiceRoot{position:fixed;inset:0;z-index:60;display:none;}
#practiceRoot.show{display:block;}
.prac-sheet{position:absolute;inset:0;background:var(--bg);overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 120px;}
.prac-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.prac-top .t{font-size:17px;font-weight:700;color:var(--primary-deep);}
.close-btn{border:none;background:var(--card);width:34px;height:34px;border-radius:50%;font-size:17px;cursor:pointer;color:var(--ink-2);box-shadow:var(--shadow);}
/* 弹层内学习进度条 */
.prac-prog{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow);}
.prac-prog .pp-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-2);margin-bottom:8px;}
.prac-prog .pp-head b{color:var(--primary-deep);}
.prac-prog .pp-head .pp-navbtn{display:flex;gap:6px;}
.pp-navbtn button{border:1px solid var(--line);background:var(--bg-soft);color:var(--primary-deep);border-radius:14px;padding:3px 11px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--font-sans);}
.pp-navbtn button:disabled{opacity:.4;cursor:default;}
.prac-prog .bar > i.done{background:linear-gradient(90deg,var(--ok),#5FB98F);}
.mode-row{display:flex;align-items:center;gap:9px;margin-bottom:13px;}
.mode-row .mode-lbl{font-size:13px;color:var(--ink-2);font-weight:600;flex:0 0 auto;}
.mode-row .seg{flex:1;}
.mode-tip{font-size:12px;color:var(--ink-3);margin:-6px 0 13px;line-height:1.5;}
.prac-sentence{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 16px;margin-bottom:14px;}
.prac-sentence .en-line{font-family:var(--font-en);font-size:21px;line-height:1.6;}
.prac-sentence .zh-line{font-size:14.5px;color:var(--ink-2);margin-top:8px;}
.wtok{display:inline-block;padding:1px 2px;border-radius:4px;transition:background .2s;}
.wtok.match{background:var(--ok-soft);color:var(--ok);font-weight:600;}
.wtok.miss{background:var(--bad-soft);color:var(--bad);text-decoration:underline wavy var(--bad) 1.5px;}
.wtok.current{box-shadow:0 0 0 2px var(--accent);}

.ctl-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.ctl{flex:1;min-width:120px;border:none;border-radius:var(--radius-sm);padding:13px 10px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--font-sans);color:#fff;background:var(--primary);display:flex;align-items:center;justify-content:center;gap:7px;}
.ctl:active{filter:brightness(.95);}
.ctl.listen{background:var(--accent);}
.ctl.rec{background:var(--bad);}
.ctl.stop{background:var(--ink-3);}
.ctl.ghost{background:var(--card);color:var(--primary-deep);border:1.5px solid var(--line);}
.replay-row .ctl{gap:6px;}
.replay-tip{font-size:12px;color:var(--ink-3);text-align:center;margin:-6px 0 2px;line-height:1.5;}
.mic-pulse{width:12px;height:12px;border-radius:50%;background:#fff;display:inline-block;animation:pulse 1s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.6)}100%{box-shadow:0 0 0 10px rgba(255,255,255,0)}}

.interim{background:var(--card);border:1.5px dashed var(--line);border-radius:var(--radius-sm);padding:10px 13px;font-size:14.5px;color:var(--ink-2);margin-bottom:12px;display:none;font-family:var(--font-en);min-height:20px;}
.interim.show{display:block;}

/* 评分 */
.result{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;display:none;}
.result.show{display:block;}
.score-head{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
.score-ring{--p:0;width:74px;height:74px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--bg-soft) 0);}
.score-ring > i{width:58px;height:58px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:22px;font-weight:800;color:var(--primary-deep);}
.score-ring.warn{background:conic-gradient(var(--warn) calc(var(--p)*1%),var(--bg-soft) 0);}
.score-ring.bad{background:conic-gradient(var(--bad) calc(var(--p)*1%),var(--bg-soft) 0);}
.score-label{font-size:15px;font-weight:700;}
.score-sub{font-size:12.5px;color:var(--ink-3);margin-top:2px;}

/* 问题词 / 音素反馈 */
.phon-issues{margin-top:12px;}
.phon-title{font-size:13.5px;font-weight:700;color:var(--ink-2);margin:6px 0 8px;}
.phon-item{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;}
.phon-item .pw{font-family:var(--font-en);font-size:16px;font-weight:700;color:var(--bad);}
.phon-item .heard{font-size:12.5px;color:var(--ink-3);margin-top:2px;}
.phon-item .heard b{color:var(--ink-2);}
.ipa-diff{font-family:var(--font-en);font-size:15px;margin-top:6px;letter-spacing:1px;}
.ipa-diff .ph{padding:0 1px;border-radius:3px;}
.ipa-diff .ph.bad-ph{background:var(--bad-soft);color:var(--bad);font-weight:700;}
.ipa-diff .ph.good-ph{color:var(--ink-2);}
.tip{font-size:12.5px;color:var(--primary-deep);background:var(--primary-soft);border-radius:8px;padding:7px 10px;margin-top:7px;line-height:1.5;}
.tip .k{font-weight:700;}
.no-issue{font-size:13.5px;color:var(--ok);background:var(--ok-soft);border-radius:8px;padding:9px 12px;margin-top:8px;}

/* ===== 库 / 筛选 ===== */
.filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--ink-2);font-size:13px;font-weight:600;padding:6px 14px;border-radius:20px;cursor:pointer;font-family:var(--font-sans);white-space:nowrap;}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff;}
.search-box{width:100%;border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:10px 13px;font-size:15px;background:var(--card);font-family:var(--font-sans);margin-bottom:12px;outline:none;}
.search-box:focus{border-color:var(--primary);}

/* ===== 统计 ===== */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px;}
.stat-card{background:var(--card);border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:12px 8px;text-align:center;border:1px solid var(--line);}
.stat-card .num{font-size:23px;font-weight:800;color:var(--primary-deep);font-family:var(--font-en);}
.stat-card .lab{font-size:11px;color:var(--ink-3);margin-top:2px;}
/* 连续打卡横幅 */
.streak-banner{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,var(--warn-soft),var(--card));border:1px solid var(--line);border-radius:var(--radius);padding:12px 15px;margin-bottom:10px;box-shadow:var(--shadow);}
.streak-banner .sb-flame{font-size:32px;line-height:1;flex:0 0 auto;filter:drop-shadow(0 2px 3px rgba(194,163,117,.35));}
.streak-banner .sb-txt{flex:1;min-width:0;}
.streak-banner .sb-num{font-size:17px;font-weight:800;color:var(--warn);font-family:var(--font-en);}
.streak-banner .sb-msg{font-size:12px;color:var(--ink-2);margin-top:1px;}
.streak-banner .sb-badge{font-size:9px;font-weight:800;letter-spacing:1px;color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:2px 5px;flex:0 0 auto;}

/* ===== 今日页三块：开始学习 / 练习日历 / 已学内容 ===== */
.home-block{margin-bottom:20px;}
.block-head{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;margin:0 2px 10px;color:var(--primary-deep);}
.block-head .bh-ico{font-size:19px;}
.block-head .sp{flex:1;}
.block-head .bh-more{font-size:12.5px;font-weight:600;color:var(--primary);background:none;border:none;cursor:pointer;font-family:var(--font-sans);padding:4px 8px;border-radius:12px;}
.start-hero{background:linear-gradient(135deg,var(--primary),var(--primary-deep));color:#fff;border-radius:var(--radius);padding:16px 17px;margin-bottom:12px;box-shadow:var(--shadow);}
.start-hero .sh-top{display:flex;align-items:center;gap:11px;}
.start-hero .sh-mascot{width:46px;height:46px;flex:0 0 auto;}
.start-hero .sh-txt{flex:1;min-width:0;}
.start-hero .sh-t1{font-size:16px;font-weight:700;}
.start-hero .sh-t2{font-size:12px;opacity:.9;margin-top:2px;}
.start-hero .sh-bar{height:8px;border-radius:6px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:13px;}
.start-hero .sh-bar > i{display:block;height:100%;background:#fff;border-radius:6px;transition:width .4s ease;}
.start-hero .sh-meta{display:flex;justify-content:space-between;font-size:11.5px;opacity:.92;margin-top:6px;}
.start-btn{width:100%;margin-top:13px;border:none;background:#fff;color:var(--primary-deep);font-size:15.5px;font-weight:800;padding:12px;border-radius:12px;cursor:pointer;font-family:var(--font-sans);box-shadow:0 3px 10px rgba(0,0,0,.12);}
.start-btn:active{transform:scale(.99);}

/* 练习日历 */
.cal-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.cal-head .cal-title{font-family:var(--font-en);font-size:15px;font-weight:700;color:var(--primary-deep);}
.cal-nav{display:flex;gap:6px;}
.cal-nav button{border:1px solid var(--line);background:var(--bg-soft);color:var(--primary-deep);width:30px;height:30px;border-radius:50%;font-size:15px;cursor:pointer;font-family:var(--font-sans);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-dow{font-family:var(--font-en);font-size:10.5px;color:var(--ink-3);text-align:center;padding-bottom:3px;}
.cal-day{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;color:var(--ink-2);position:relative;line-height:1.1;}
.cal-day.empty{visibility:hidden;}
.cal-day .cd-n{font-family:var(--font-en);}
.cal-day .cd-c{font-size:9px;font-weight:700;}
.cal-day.has{background:var(--primary-soft);color:var(--primary-deep);}
.cal-day.has .cd-c{color:var(--primary);}
.cal-day.today{box-shadow:0 0 0 2px var(--primary) inset;}
.cal-legend{display:flex;gap:14px;font-size:11px;color:var(--ink-3);margin-top:10px;justify-content:center;}
.cal-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px;}

/* 已学记录弹层 */
#learnedRoot{position:fixed;inset:0;z-index:60;display:none;}
#learnedRoot.show{display:block;}
.learned-sheet{position:absolute;inset:0;background:var(--bg);overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 40px;}
.learned-stat{display:flex;gap:10px;margin-bottom:14px;}
.learned-stat .ls{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;flex:1;text-align:center;}
.learned-stat .ls .n{font-family:var(--font-en);font-size:22px;font-weight:800;color:var(--primary-deep);}
.learned-stat .ls .l{font-size:11px;color:var(--ink-3);}
.lr-item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 13px;margin-bottom:9px;box-shadow:var(--shadow);}
.lr-item .lr-en{font-family:var(--font-en);font-size:15px;line-height:1.45;}
.lr-item .lr-zh{font-size:12px;color:var(--ink-2);margin-top:4px;}
.lr-item .lr-meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11.5px;color:var(--ink-3);}
.lr-score{font-family:var(--font-en);font-weight:800;font-size:13px;padding:1px 8px;border-radius:10px;}
.lr-score.ok{background:var(--ok-soft);color:var(--ok);}
.lr-score.warn{background:var(--warn-soft);color:var(--warn);}
.lr-score.bad{background:var(--bad-soft);color:var(--bad);}
.lr-again{margin-left:auto;border:1px solid var(--line);background:var(--primary-soft);color:var(--primary-deep);font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:12px;cursor:pointer;font-family:var(--font-sans);}

/* ===== 设置 / 更多 ===== */
.set-group{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:14px;overflow:hidden;}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:14px 15px;border-bottom:1px solid var(--line);font-size:15px;}
.set-row:last-child{border-bottom:none;}
.set-row .desc{font-size:12px;color:var(--ink-3);margin-top:2px;}
.seg{display:flex;background:var(--bg-soft);border-radius:9px;padding:3px;gap:3px;}
.seg button{border:none;background:none;padding:6px 13px;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer;font-family:var(--font-sans);}
.seg button.on{background:var(--card);color:var(--primary-deep);box-shadow:0 1px 3px rgba(0,0,0,.08);}
input[type=range]{width:110px;accent-color:var(--primary);}
.goal-ctl{display:flex;align-items:center;gap:6px;}
.goal-input{width:62px;text-align:center;font-family:var(--font-en);font-size:15px;font-weight:700;color:var(--primary-deep);background:var(--primary-soft);border:1.5px solid var(--line);border-radius:8px;padding:5px 4px;outline:none;-moz-appearance:textfield;}
.goal-input::-webkit-inner-spin-button,.goal-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
.goal-input:focus{border-color:var(--primary);background:var(--card);}

/* 设备使用说明 */
.help-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 15px;}
.help-card .seg{margin-bottom:13px;}
.help-step{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
.help-step:last-child{border-bottom:none;}
.help-step .hs-n{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--primary-soft);color:var(--primary-deep);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.help-step .hs-t{font-size:13.5px;color:var(--ink);line-height:1.6;}
.help-step .hs-t b{color:var(--primary-deep);}
.help-step .hs-t .sub{display:block;color:var(--ink-2);font-size:12.5px;margin-top:2px;}
.help-warn{background:var(--warn-soft);border-radius:var(--radius-sm);padding:9px 11px;font-size:12.5px;color:var(--warn);line-height:1.6;margin-top:10px;}

/* 字幕导入 */
.import-area{width:100%;min-height:120px;border:1.5px dashed var(--line);border-radius:var(--radius-sm);padding:12px;font-size:14px;font-family:monospace;background:var(--bg);resize:vertical;outline:none;line-height:1.5;}
.file-row{display:flex;gap:10px;margin:10px 0;}
.file-row button{flex:1;border:1.5px solid var(--primary);background:var(--primary-soft);color:var(--primary-deep);font-weight:700;padding:11px;border-radius:var(--radius-sm);font-size:14.5px;cursor:pointer;font-family:var(--font-sans);}
.alert{font-size:13px;border-radius:9px;padding:9px 12px;margin:10px 0;display:none;}
.alert.show{display:block;}
.alert.ok{background:var(--ok-soft);color:var(--ok);}
.alert.err{background:var(--bad-soft);color:var(--bad);}
.alert.info{background:var(--accent-soft);color:var(--accent);}

.empty{text-align:center;color:var(--ink-3);padding:40px 20px;font-size:14px;}
.empty .e-ico{font-size:40px;margin-bottom:10px;opacity:.6;}

/* 加载 */
.loading{text-align:center;padding:50px 0;color:var(--ink-3);font-size:14px;}
.spinner{width:28px;height:28px;border:3px solid var(--bg-soft);border-top-color:var(--primary);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.fade-in{animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:24px;font-size:13.5px;z-index:80;box-shadow:0 4px 16px rgba(0,0,0,.2);opacity:0;transition:opacity .2s;pointer-events:none;max-width:82%;text-align:center;}
.toast.show{opacity:.95;}
/* ===== 学习提醒弹窗 ===== */
#remindRoot{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(46,58,51,.35);backdrop-filter:blur(3px);}
#remindRoot.show{display:flex;}
.remind-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 22px 20px;max-width:340px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.18);animation:remindPop .35s cubic-bezier(.34,1.56,.64,1);}
@keyframes remindPop{from{opacity:0;transform:scale(.85) translateY(12px)}to{opacity:1;transform:none}}
.remind-ico{font-size:44px;line-height:1;margin-bottom:10px;}
.remind-title{font-size:18px;font-weight:800;color:var(--ink);margin-bottom:8px;}
.remind-body{font-size:13.5px;color:var(--ink-2);line-height:1.65;margin-bottom:18px;}
.remind-actions{display:flex;gap:10px;}
.remind-actions button{flex:1;padding:11px 0;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font-sans);border:none;}
.remind-go{background:var(--primary);color:#fff;}
.remind-later{background:var(--bg-soft);color:var(--ink-2);}
</style>

<body>
<div id="app">
  <header>
      <div class="row">
      <div>
        <div class="brand"><img class="brand-logo" src="assets/tab-avatar.png" alt="Oral practice"><span class="brand-title">Oral practice</span></div>
        <div class="head-sub" id="headerDate">—</div>
      </div>
      <div class="head-user" id="headUser" title="点击修改昵称">
        <div class="uid"><span class="uid-name" id="uidName">Charlie</span><span class="uid-hint">tap to edit</span></div>
        <button class="avatar-btn" id="avatarBtn" title="点击更换头像"><img src="assets/avatar-default.png" alt="我的头像" style="width:100%;height:100%;object-fit:cover;"></button>
      </div>
    </div>
    <input type="file" id="avatarFile" accept="image/*" style="display:none" />
  </header>
  <main id="view"><div class="loading"><div class="spinner"></div>加载中…</div></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<!-- 跟读练习弹层 -->
<div id="practiceRoot"></div>
<!-- 已学内容弹层 -->
<div id="learnedRoot"></div>
<!-- 轻提示 -->
<div class="toast" id="toast"></div>
<!-- 学习提醒弹窗 -->
<div id="remindRoot"></div>

<script>
"use strict";
/* ============================================================
 * 英语口语教练 · 单文件应用
 * 数据：data/today-<date>.json / data/corpus.json / data/words.json
 * 无 Supabase，纯静态 + localStorage
 * ============================================================ */

// ---------- 工具 ----------
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function localDateStr(d=new Date()){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}
function shiftDate(dateStr, days){
  const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+days); return localDateStr(d);
}
function fmtDateCN(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  return `${d.getMonth()+1}月${d.getDate()}日 · 周${'日一二三四五六'[d.getDay()]}`;
}
// 英文日期 + 时间（标题下方显示，统一 en 字体）
const EN_MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const EN_DAY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmtHeaderDateTime(d=new Date()){
  const date=`${EN_DAY[d.getDay()]}, ${EN_MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
  let h=d.getHours(), m=String(d.getMinutes()).padStart(2,'0');
  const ap=h>=12?'PM':'AM'; h=h%12||12;
  return `${date} · ${h}:${m} ${ap}`;
}
const wordCount = s => String(s||'').trim().split(/\s+/).filter(Boolean).length;
let toastTimer=null;
function toast(msg, ms=1900){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'), ms);
}

// ---------- 本地状态 ----------
const LS_KEY='esc-store-v2';
const store = {
  settings:{ accent:'US', rate:0.95, showZh:true, autoStop:true, sentenceGoal:20, wordGoal:10, practiceMode:'direct',
    remindEnabled:true, remindTime:'21:00', remindNotifiedDate:'', darkMode:false },
  avatar:'',       // 头像 dataURL（压缩后）；为空时用默认头像
  uid:'Charlie',   // 用户昵称（右上角显示，可点击修改）
  progress:{},      // id -> {score, ts}
  mistakes:[],      // 需复习的 id（保留最近 60）
  wordsDone:{},     // date -> [w]
  imported:[],      // 字幕导入句
};
function loadStore(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){ const s=JSON.parse(raw); Object.assign(store, s); Object.assign(store.settings, s.settings||{}); }
  }catch(e){ console.warn('store 读取失败', e); }
}
function saveStore(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }catch(e){} }
function applyTheme(){
  const dark=!!store.settings.darkMode;
  document.documentElement.classList.toggle('dark', dark);
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', dark?'#1B211E':'#6E8F7E');
}
function markProgress(id, score){
  store.progress[id]={ score, ts:Date.now() };
  if(score<70 && !store.mistakes.includes(id)){ store.mistakes.push(id); if(store.mistakes.length>60) store.mistakes.shift(); }
  if(score>=85){ const i=store.mistakes.indexOf(id); if(i>=0) store.mistakes.splice(i,1); }
  saveStore();
}
function isDone(id){ const p=store.progress[id]; return p && p.score>=85; }

// ---------- 数据 ----------
let DB={ today:null, corpus:[], words:[], wordMap:{}, wordsByIpa:[] };
async function fetchJSON(url, cacheKey){
  const cached=()=>{ try{ return JSON.parse(localStorage.getItem(cacheKey)); }catch(e){ return null; } };
  const c0=cached();
  try{
    const r=await fetch(url, {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(Array.isArray(j)||j&&typeof j==='object'){ try{ localStorage.setItem(cacheKey, JSON.stringify(j)); }catch(e){} return j; }
    throw new Error('bad json');
  }catch(e){
    if(c0) { console.warn('fetch '+url+' 失败，用缓存：'+e.message); return c0; }
    throw e;
  }
}
async function loadToday(){
  const today=localDateStr();
  for(let k=0;k<3;k++){
    const d=shiftDate(today,-k);
    try{ const j=await fetchJSON('data/today-'+d+'.json','esc-today-'+d); if(j && j.short) return j; }catch(e){}
  }
  return null;
}
function normText(s){
  return String(s||'').toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9'\s]/g,' ').replace(/\s+/g,' ').trim();
}
function djb2(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return h; }
function mulberry32(seed){ let a=seed>>>0; return function(){ a|=0;a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function seededShuffle(arr,rng){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// 本地兜底生成（Actions 未跑 / 断网时）
function localGeneratePlan(corpus, words, dateStr){
  const rng=mulberry32(djb2('plan-'+dateStr));
  const shortPool=seededShuffle(corpus.filter(x=>x.en&&wordCount(x.en)>=4&&wordCount(x.en)<=22), rng);
  const longPool=seededShuffle(corpus.filter(x=>x.en&&wordCount(x.en)>=30), rng);
  const short=shortPool.slice(0,20);
  const long=longPool.slice(0,Math.min(3,Math.max(2,longPool.length)));
  const ipaWords=words.filter(w=>w.i);
  const dayIndex=Math.floor(Date.parse(dateStr+'T00:00:00Z')/86400000);
  const offset=(((dayIndex%ipaWords.length)+ipaWords.length)%ipaWords.length)||0;
  const nw=[]; for(let k=0;k<10&&ipaWords.length;k++) nw.push(ipaWords[(offset+k)%ipaWords.length]);
  return { date:dateStr, generatedAt:new Date().toISOString(), local:true,
    short, long, words:nw,
    meta:{ shortCount:short.length, shortTotalWords:short.reduce((a,s)=>a+wordCount(s.en),0), longCount:long.length, newWords:nw.length } };
}
async function loadAll(){
  loadStore();
  const [todayRaw, corpus, words] = await Promise.all([
    loadToday().catch(()=>null),
    fetchJSON('data/corpus.json','esc-corpus').catch(()=>[]),
    fetchJSON('data/words.json','esc-words').catch(()=>[]),
  ]);
  DB.corpus=corpus||[];
  DB.words=words||[];
  DB.wordMap={}; DB.wordsByIpa=[];
  for(const w of DB.words){ if(!DB.wordMap[w.w.toLowerCase()]) DB.wordMap[w.w.toLowerCase()]=w; if(w.i) DB.wordsByIpa.push(w); }
  const dateStr=localDateStr();
  DB.today = todayRaw && (todayRaw.date>=shiftDate(dateStr,-1)) ? todayRaw : localGeneratePlan(DB.corpus, DB.words, dateStr);
  // 合并字幕导入句进库视图
  DB.allSentences = [...store.imported, ...DB.corpus];
}
function findSentence(id){
  return DB.allSentences.find(x=>x.id===id) || DB.today.short.find(x=>x.id===id) || DB.today.long.find(x=>x.id===id) || null;
}

// ---------- 平台探测（iOS / Android / 其他）----------
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const IS_ANDROID = /Android/i.test(navigator.userAgent);
// 语音功能不可用时的跨平台指引文案
const VOICE_SETUP_TIP = IS_IOS
  ? '请到 iPhone 设置 › 辅助功能 › 朗读内容 › 语音，添加「美国英语」'
  : IS_ANDROID
    ? '请确认已安装 Google 文字转语音，并在 设置 › 系统 › 语言与输入 › 文字转语音 中下载英语语音'
    : '当前浏览器未找到英文语音，请安装英文语音包后重试';
const DICTATION_SETUP_TIP = IS_IOS
  ? '请到 iPhone 设置 › 通用 › 键盘 › 听写，添加「英语(美国)」'
  : IS_ANDROID
    ? '请确认已联网并允许麦克风权限，建议用 Chrome 浏览器打开'
    : '当前浏览器不支持语音识别，请用 Chrome 或 Safari 打开';

// ---------- 头像 ----------
function renderUid(){
  const el=$('#uidName'); if(!el) return;
  el.textContent=store.uid||'Charlie';
}
function renderAvatar(){
  const b=$('#avatarBtn'); if(!b) return;
  const src=store.avatar||'assets/avatar-default.png';
  b.innerHTML=`<img src="${src}" alt="我的头像" style="width:100%;height:100%;object-fit:cover;">`;
  renderUid();
}
function setupUid(){
  const box=$('#headUser'); if(!box) return;
  box.onclick=(e)=>{
    if(e.target.closest('#avatarBtn')) return; // 头像点击单独处理上传
    const cur=store.uid||'Charlie';
    const name=window.prompt('Your nickname / ID', cur);
    if(name==null) return;
    const v=String(name).trim().slice(0,16)||'Charlie';
    store.uid=v; saveStore(); renderUid(); toast('昵称已更新 ✓');
  };
}
function setupAvatar(){
  renderAvatar();
  setupUid();
  const btn=$('#avatarBtn'), file=$('#avatarFile');
  if(!btn||!file) return;
  btn.onclick=()=>file.click();
  file.onchange=(e)=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    if(!/^image\//.test(f.type)){ toast('请选择图片文件'); return; }
    const rd=new FileReader();
    rd.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        try{
          const S=120, cx=document.createElement('canvas'); cx.width=S; cx.height=S;
          const ctx=cx.getContext('2d');
          // 居中裁方
          const side=Math.min(img.width,img.height);
          const sx=(img.width-side)/2, sy=(img.height-side)/2;
          ctx.drawImage(img, sx,sy,side,side, 0,0,S,S);
          store.avatar=cx.toDataURL('image/jpeg',0.82);
          saveStore(); renderAvatar(); toast('头像已更新 ✓');
        }catch(err){ toast('头像处理失败，换张图试试'); }
      };
      img.onerror=()=>toast('图片读取失败');
      img.src=rd.result;
    };
    rd.readAsDataURL(f);
    file.value='';
  };
}

// ---------- TTS ----------
let ttsVoices=[];
function refreshVoices(){ if('speechSynthesis' in window){ try{ ttsVoices=speechSynthesis.getVoices(); }catch(e){} } }
if('speechSynthesis' in window){ refreshVoices(); speechSynthesis.onvoiceschanged=refreshVoices; }
let speechUnlocked=false;
function pickVoice(lang){
  const base=(lang||'en-US').split('-')[0].toLowerCase();
  return ttsVoices.find(v=>v.lang===lang)
    || ttsVoices.find(v=>v.lang && v.lang.toLowerCase()===lang.toLowerCase())
    || ttsVoices.find(v=>v.lang && v.lang.toLowerCase().startsWith(base))
    || ttsVoices.find(v=>v.lang && base==='en' && /en/i.test(v.lang))
    || null;
}
function unlockSpeech(){
  if(speechUnlocked||!('speechSynthesis' in window))return;
  speechUnlocked=true;
  try{
    const d=new SpeechSynthesisUtterance(' ');
    d.volume=0; d.rate=10;
    speechSynthesis.speak(d);
  }catch(e){}
}
function speak(text, {rate, accent, onend}={}){
  if(!('speechSynthesis' in window)){ toast('当前浏览器不支持语音示范'); return; }
  if(!ttsVoices.length) refreshVoices();
  const lang=(accent||store.settings.accent)==='UK'?'en-GB':'en-US';
  const v=pickVoice(lang);
  if(!v){
    toast('没找到英文语音：'+VOICE_SETUP_TIP, 4000);
  }
  const u=new SpeechSynthesisUtterance(text);
  u.rate = rate!=null?rate:store.settings.rate;
  u.lang=lang;
  if(v) u.voice=v;
  if(onend) u.onend=onend;
  u.onerror=(e)=>{ if(e.error && e.error!=='canceled' && e.error!=='interrupted') console.warn('TTS error:', e.error); };
  unlockSpeech();
  try{
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }catch(e){ toast('朗读失败：'+(e.message||e)); }
}
function speakWithBtn(btn, text){
  if(!btn) return speak(text);

  let done=false;

// ---------- 语音识别 + 词级对齐 + 音素反馈 ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
function normalizeWords(text){
  return (text||'').toLowerCase().replace(/[^a-z0-9' \-]/g,' ').replace(/['\-]/g,' ').trim().split(/\s+/).filter(Boolean);
}
// 顺序对齐：原句每词 match/miss + 多出的 extra
function alignWords(targetText, recognizedText){
  const t=normalizeWords(targetText), r=normalizeWords(recognizedText);
  const res=t.map(w=>({word:w, state:'miss'}));
  const extras=[]; let j=0;
  for(let i=0;i<t.length;i++){
    if(j<r.length && t[i]===r[j]){ res[i].state='match'; j++; continue; }
    const k=r.indexOf(t[i], j);
    if(k>-1){ for(let x=j;x<k;x++) extras.push(r[x]); j=k+1; res[i].state='match'; }
    else res[i].state='miss';
  }
  for(let x=j;x<r.length;x++) extras.push(r[x]);
  return {target:res, extras, matchCount:res.filter(x=>x.state==='match').length};
}
const scoreOf = a => a.target.length? Math.round(a.matchCount/a.target.length*100):0;
function scoreLabel(s){
  if(s>=85) return {text:'发音不错，继续保持', cls:'ok'};
  if(s>=70) return {text:'基本到位，个别词再练练', cls:'warn'};
  if(s>=50) return {text:'有几处没读准，建议重练', cls:'warn'};
  return {text:'差距较大，先听示范再尝试', cls:'bad'};
}

// -- IPA 处理 --
const DIGRAPHS=['tʃ','dʒ'];
function tokenizeIpa(s){
  s=String(s||''); const toks=[]; let i=0;
  while(i<s.length){
    let hit=false;
    for(const dg of DIGRAPHS){ if(s.startsWith(dg,i)){ toks.push(dg); i+=dg.length; hit=true; break; } }
    if(hit) continue;
    const ch=s[i];
    if(ch==='ː' && toks.length){ toks[toks.length-1]+= 'ː'; i++; continue; } // 长音并入前一元音
    toks.push(ch); i++;
  }
  return toks;
}
const ipaForDiff = s => tokenizeIpa(s).filter(t=>t!=='ˈ'&&t!=='ˌ');
// LCS 对齐，返回目标音素的操作：keep / del(用户漏读)
function ipaOps(target, heard){
  const a=ipaForDiff(target), b=ipaForDiff(heard);
  const n=a.length,m=b.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--) dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const ops=[]; let i=0,j=0;
  while(i<n&&j<m){ if(a[i]===b[j]){ops.push({op:'keep',ph:a[i]});i++;j++;} else if(dp[i+1][j]>=dp[i][j+1]){ops.push({op:'del',ph:a[i]});i++;} else {ops.push({op:'ins',ph:b[j]});j++;} }
  while(i<n){ops.push({op:'del',ph:a[i]});i++;}
  return {a, ops, delCount:ops.filter(o=>o.op==='del').length};
}
// 词形还原（找音标用）
function stemForms(w){
  w=String(w||'').toLowerCase().replace(/[^a-z-]/g,'');
  const f=[w];
  if(w.endsWith('ies')) f.push(w.slice(0,-3)+'y');
  if(w.endsWith('es')&&!w.endsWith('ss')) f.push(w.slice(0,-2));
  if(w.endsWith('s')&&!w.endsWith('ss')&&w.length>2) f.push(w.slice(0,-1));
  if(w.endsWith('ed')) f.push(w.slice(0,-2),w.slice(0,-1));
  if(w.endsWith('ing')) f.push(w.slice(0,-3),w.slice(0,-4));
  return f.filter(Boolean);
}
function ipaOf(w){
  for(const f of stemForms(w)){ const e=DB.wordMap[f]; if(e&&e.i) return e.i; }
  return '';
}
// 中式发音高危音素提示
const PHONEME_HINTS={
  'θ':'<span class="k">/θ/ 轻 th</span>：舌尖轻咬上齿缝送气，别读成 /s/ 或 /t/',
  'ð':'<span class="k">/ð/ 重 th</span>：舌尖咬齿缝并振动声带，别读成 /z/ 或 /d/',
  'ʃ':'<span class="k">/ʃ/ sh</span>：气流卷起往后，别读成 /s/',
  'ʒ':'<span class="k">/ʒ/」vision 的 zh</span>：卷舌气流+振动声带',
  'ɜ':'<span class="k">/ɜː/ bird 的 e</span>：舌居中部不圆唇，别读成 /e/ 或 /u/',
  'ə':'<span class="k">/ə/ 中央元音</span>：放松发"呃"，最常见弱读',
  'v':'<span class="k">/v/</span>：上齿咬下唇振动，别读成 /w/',
  'b':'<span class="k">/b/</span>：双唇闭合弹开无摩擦，与 /v/ 区分',
  'l':'<span class="k">词尾 /l/</span>：舌根后顶硬腭，别补成"哦"',
  'r':'<span class="k">词尾 /r/</span>：舌身往后缩卷，别读成 /l/',
  'ŋ':'<span class="k">词尾 /ŋ/ ng</span>：舌根抵软腭，别加 g 音',
  'k':'<span class="k">词尾 /k/</span>：短促收尾，别补元音',
  't':'<span class="k">词尾 /t/</span>：短促轻送气，别补元音',
  'p':'<span class="k">词尾 /p/</span>：短促收尾，别补元音',
  's':'<span class="k">词尾 /s/</span>：短促收尾，别补元音',
  'æ':'<span class="k">/æ/</span>：张大嘴前伸，别读成 /e/',
  'ɪ':'<span class="k">短 /ɪ/</span>：比长 /iː/ 短而松',
  'ɛ':'<span class="k">/ɛ/ e</span>：前元音，嘴角略展开',
  'ɔ':'<span class="k">/ɔː/ o</span>：圆唇后元音',
  'ʊ':'<span class="k">短 /ʊ/</span>：比长 /uː/ 短，双唇略圆',
  'w':'<span class="k">/w/</span>：双唇收圆后弹开，别读成 /v/',
};
// 针对整词的补充高危特征提示
function wordLevelTips(ipa){
  const tips=[];
  const s=ipa||'';
  if(/θ|ð/.test(s)) tips.push('这个词含 <b>th</b>：一定把舌尖伸到上下齿之间');
  if(/ɜː|ɜ/.test(s)) tips.push('含 <b>bird 的 e</b>：舌头放中间，不要圆唇');
  if(/v/.test(s)) tips.push('含 <b>v</b>：上牙轻咬下唇，不要读成 w');
  if(/l$/.test(s)) tips.push('词尾是 <b>l</b>：舌根后顶，别补元音');
  if(/r$/.test(s)) tips.push('词尾是 <b>r</b>：舌头后缩卷起，别读成 l');
  if(/(aɪ|eɪ|ɔɪ|aʊ|oʊ|eə|ɪə|ʊə)/.test(s)) tips.push('含<b>双元音</b>：要滑向第二个音，别读成单元音');
  if(/[ktpsg]$/.test(s)) tips.push('词尾<b>辅音</b>要短促，不要拖出元音');
  return tips;
}
// 汇总一个读错词的反馈
function buildWordFeedback(word, heardWord){
  const targetIpa=ipaOf(word);
  const heardIpa=heardWord?ipaOf(heardWord):'';
  let badPhs=[], tips=[];
  if(targetIpa && heardIpa && targetIpa!==heardIpa){
    const {ops}=ipaOps(targetIpa, heardIpa);
    for(const o of ops) if(o.op==='del') badPhs.push(o.ph);
  } else if(targetIpa){
    // 没识别到对应词 → 标出该词的高危音素（取 th/ð/v/ɜ 等）
    for(const t of tokenizeIpa(targetIpa)){ if(PHONEME_HINTS[t]) badPhs.push(t); }
  }
  badPhs=[...new Set(badPhs)].slice(0,4);
  // 提示：优先音素提示，再补整词特征
  for(const ph of badPhs){ if(PHONEME_HINTS[ph] && !tips.some(t=>t.includes(ph))) tips.push(PHONEME_HINTS[ph]); }
  const wt=wordLevelTips(targetIpa);
  for(const t of wt){ if(!tips.some(x=>x.includes(t.slice(0,8)))) tips.push(t); }
  tips=tips.slice(0,3);
  return {targetIpa, heardIpa, badPhs, tips};
}
function renderIpaDiff(targetIpa, badPhs){
  if(!targetIpa) return '';
  const bad=new Set(badPhs);
  return tokenizeIpa(targetIpa).map(ph=>{
    if(ph==='ˈ'||ph==='ˌ') return `<span class="ph good-ph">${esc(ph)}</span>`;
    const isBad = bad.has(ph) || bad.has(ph.replace('ː',''));
    return `<span class="ph ${isBad?'bad-ph':'good-ph'}">${esc(ph)}</span>`;
  }).join('');
}

// 识别会话
let recog=null, recogTimer=null, recogFinal='';
function startRecognition(targetText, onFinal, onInterim){
  if(!SR){ toast('不支持语音识别：'+DICTATION_SETUP_TIP, 3800); return null; }
  if(recog){ try{ recog.abort(); }catch(e){} }
  recogFinal='';
  recog=new SR();
  recog.lang = (store.settings.accent==='UK')?'en-GB':'en-US';
  recog.interimResults=true;
  recog.maxAlternatives=1;
  recog.onresult=(e)=>{
    let interim='', final='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal) final+=t; else interim+=t;
    }
    if(final) recogFinal=final;
    if(interim) onInterim && onInterim(interim);
  };
  recog.onend=()=>{ onFinal && onFinal(recogFinal || recog._lastInterim || ''); };
  recog.onerror=(e)=>{
    console.warn('recognition error', e.error);
    const m={
      'not-allowed':'麦克风权限被拒绝：请在浏览器设置中允许本站使用麦克风后重试',
      'service-not-allowed':'麦克风权限被拒绝，请检查浏览器的麦克风设置',
      'network':'语音识别需要联网：请确认网络可用（安卓需能访问 Google 服务）后重试',
      'no-speech':'没听清，请靠近麦克风再读一遍',
      'audio-capture':'找不到麦克风，请检查设备'
    };
    if(m[e.error]) toast(m[e.error], 3500);
  };
  try{ recog.start(); }catch(e){ toast('启动识别失败，请重试'); return null; }
  // 超时：随词数缩放（每词 ~0.9s + 3s 缓冲），可手动停止
  const words=wordCount(targetText);
  const limitMs = Math.max(6000, Math.min(20000, 3000 + words*900));
  if(store.settings.autoStop){
    recogTimer=setTimeout(()=>{ try{ recog.stop(); }catch(e){} }, limitMs);
  }
  return recog;
}
function stopRecognition(){ if(recogTimer){ clearTimeout(recogTimer); recogTimer=null; } if(recog){ try{ recog.stop(); }catch(e){} } }

// ---------- 我的录音回放（对比原声） ----------
let myRecorder=null, myChunks=[], myStream=null, myRecActive=false, myAudioUrl=null;
function pickMime(){
  if(typeof MediaRecorder==='undefined') return '';
  const cands=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'];
  for(const m of cands){ try{ if(MediaRecorder.isTypeSupported(m)) return m; }catch(e){} }
  return '';
}
function canRecord(){ return typeof MediaRecorder!=='undefined' && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia); }
async function startMyRecording(){
  if(!canRecord()) return false;
  try{
    if(myStream){ myStream.getTracks().forEach(t=>t.stop()); }
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    myStream=stream; myChunks=[];
    const mime=pickMime();
    try{ myRecorder = mime ? new MediaRecorder(stream,{mimeType:mime}) : new MediaRecorder(stream); }
    catch(e){ myRecorder=new MediaRecorder(stream); }
    myRecorder.ondataavailable=(e)=>{ if(e.data && e.data.size>0) myChunks.push(e.data); };
    myRecorder.start();
    myRecActive=true;
    return true;
  }catch(e){ console.warn('录音启动失败', e); myRecActive=false; return false; }
}
function stopMyRecording(onDone){
  if(!myRecorder || !myRecActive){ onDone && onDone(null); return; }
  myRecorder.onstop=()=>{
    myRecActive=false;
    if(myStream){ try{ myStream.getTracks().forEach(t=>t.stop()); }catch(e){} myStream=null; }
    let url=null;
    if(myChunks.length){
      try{
        const mime=myRecorder.mimeType||'audio/webm';
        url=URL.createObjectURL(new Blob(myChunks,{type:mime}));
      }catch(e){}
    }
    myRecorder=null; myChunks=[];
    onDone && onDone(url);
  };
  try{ myRecorder.stop(); }catch(e){ myRecActive=false; myRecorder=null; onDone && onDone(null); }
}
function clearMyRecording(){
  if(myRecorder){ try{ if(myRecActive) myRecorder.stop(); }catch(e){} myRecorder=null; }
  myRecActive=false; myChunks=[];
  if(myStream){ try{ myStream.getTracks().forEach(t=>t.stop()); }catch(e){} myStream=null; }
  if(myAudioUrl){ try{ URL.revokeObjectURL(myAudioUrl); }catch(e){} myAudioUrl=null; }
}
function playMyAudio(btn){
  if(!myAudioUrl){ toast('当前设备未录到声音，无法回放'); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  const a=new Audio(myAudioUrl);
  const old=btn.textContent;
  btn.textContent='⏸ 播放中…'; btn.disabled=true;
  const restore=()=>{ btn.textContent=old; btn.disabled=false; };
  a.onended=restore; a.onerror=restore;
  a.play().catch(()=>{ restore(); toast('播放失败，请点重试'); });
}

function beginRecord(){
  const s=pracCtx.s;
  $('#result').classList.remove('show');
  $('#pracEn').innerHTML=esc(s.en);
  const recBtn=$('#btnRec'), stopBtn=$('#btnStop'), interimEl=$('#interim');
  recBtn.style.display='none'; stopBtn.style.display='';
  interimEl.classList.add('show');
  let lastInterim='';
  if(myAudioUrl){ try{ URL.revokeObjectURL(myAudioUrl); }catch(e){} myAudioUrl=null; } // 清掉上一句回放
  const handleFinal=(finalText)=>{
    const text=finalText||lastInterim;
    stopBtn.style.display='none'; recBtn.style.display='';
    recBtn.textContent=store.settings.practiceMode==='listen'?'🎧 听后跟读':'🎤 重新跟读';
    interimEl.classList.remove('show');
    // 停止录音，拿到 blob 后再渲染结果（保证回放按钮可用）
    stopMyRecording((url)=>{
      myAudioUrl=url;
      if(!text || !normalizeWords(text).length){ toast('没听清，请靠近麦克风再试一次'); return; }
      evaluate(s, text);
    });
  };
  const doStart=()=>{
    interimEl.textContent='请朗读这句话…';
    startMyRecording(); // 与识别并行录制，供回放对比（失败不影响识别）
    const r=startRecognition(s.en, handleFinal, (t)=>{ lastInterim=t; interimEl.textContent='识别中：'+t; });
    if(!r){ stopMyRecording(); recBtn.style.display=''; stopBtn.style.display='none'; interimEl.classList.remove('show'); }
  };
  if(store.settings.practiceMode==='listen' && 'speechSynthesis' in window){
    // 先听后读：播放示范，结束或超时后自动开始识别（iOS 的 onend 有时不触发，故加超时兜底）
    interimEl.textContent='🔊 正在播放示范，随后自动开始识别…';
    let started=false, alive=true;
    const kick=()=>{
      if(started || !alive) return;
      // 切换句子/关闭弹层后不再启动识别
      if(!pracCtx || pracCtx.s.id!==s.id || !$('#practiceRoot').classList.contains('show')) return;
      started=true; doStart();
    };
    // 记录本次会话引用，停止时置为失效
    pracCtx.cancelPendingListen=()=>{ alive=false; };
    try{
      speak(s.en, { onend:kick });
      setTimeout(kick, 2200); // 兜底：避免个别设备 onend 不触发导致卡住
    }catch(e){ kick(); }
  } else {
    doStart(); // 直接跟读：立即识别
  }
}
function evaluate(s, finalText){
  const hasNext = pracCtx && pracCtx.index < pracCtx.ids.length-1;
  const align=alignWords(s.en, finalText);
  const score=scoreOf(align);
  const lbl=scoreLabel(score);
  markProgress(s.id, score);
  // 高亮句子
  const enEl=$('#pracEn');
  enEl.innerHTML=align.target.map(t=>`<span class="wtok ${t.state}">${esc(t.word)}</span>`).join(' ');
  // 问题词：miss 的词 + 尽量匹配识别到的相近词
  const missed=align.target.filter(t=>t.state==='miss');
  const rWords=normalizeWords(finalText);
  const issues=[];
  for(const m of missed){
    // 找识别文本里最相近的词（编辑距离<=2 且长度接近）
    let heard='';
    for(const rw of rWords){ if(Math.abs(rw.length-m.word.length)<=2 && levenshtein(rw,m.word)<=2){ heard=rw; break; } }
    const fb=buildWordFeedback(m.word, heard);
    if(fb.targetIpa || fb.tips.length) issues.push({word:m.word, heard, ...fb});
  }
  const res=$('#result');
  res.classList.add('show');
  const ringCls= lbl.cls==='ok'?'':(lbl.cls==='warn'?'warn':'bad');
  res.innerHTML=`
    <div class="score-head">
      <div class="score-ring ${ringCls}" style="--p:${score}"><i>${score}</i></div>
      <div><div class="score-label" style="color:var(--${lbl.cls==='ok'?'ok':lbl.cls==='warn'?'warn':'bad'})">${lbl.text}</div>
      <div class="score-sub">对 ${align.matchCount}/${align.target.length} 词${align.extras.length?' · 多出 '+align.extras.length:' '}</div></div>
    </div>
    ${missed.length===0
      ? `<div class="no-issue">✓ 全部单词都读到了，发音很完整！</div>`
      : `<div class="phon-issues">
          <div class="phon-title">重点纠正（${Math.min(issues.length,4)} 处）</div>
          ${issues.slice(0,4).map(it=>`
            <div class="phon-item">
              <div class="pw">${esc(it.word)}</div>
              ${it.heard?`<div class="heard">你读成了 <b>${esc(it.heard)}</b></div>`:''}
              ${it.targetIpa?`<div class="ipa-diff" title="标准音标">${renderIpaDiff(it.targetIpa, it.badPhs)}</div>`:''}
              ${it.tips.length?`<div class="tip">${it.tips.join('<br>')}</div>`:''}
            </div>`).join('')}
        </div>`}
    <div class="ctl-row replay-row" style="margin-top:14px">
      <button class="ctl ghost" id="btnReListen">🔊 再听示范</button>
      <button class="ctl ghost" id="btnPlayMine">▶️ 回放我的</button>
    </div>
    <div class="replay-tip">先听示范再点「回放我的」，对比找出发音差距</div>
    <div class="ctl-row" style="margin-top:10px">
      ${hasNext?`<button class="ctl" id="btnNext">下一句 →</button>`:''}
      <button class="ctl ghost" id="btnFinish">完成${isDone(s.id)?' ✓':''}</button>
    </div>`;
  $('#btnReListen').onclick=(e)=>speakWithBtn(e.target, s.en);
  $('#btnPlayMine').onclick=(e)=>playMyAudio(e.currentTarget);
  if(hasNext) $('#btnNext').onclick=()=>gotoPractice(1);
  $('#btnFinish').onclick=closePractice;
  updateHomeProgressBar();
  const ppDone=$('#ppDone'); // 即时刷新弹层进度
  if(ppDone){
    const {ids}=pracCtx; const dn=ids.filter(isDone).length;
    ppDone.textContent=dn;
    const bar=$('.prac-prog .bar > i'); if(bar) bar.style.width=(ids.length?Math.round(dn/ids.length*100):0)+'%';
  }
  res.scrollIntoView({behavior:'smooth', block:'nearest'});
}
function levenshtein(a,b){
  const m=a.length,n=b.length; if(!m)return n; if(!n)return m;
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ let cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; }
  return prev[n];
}

function learnedDateSet(){
  const s=new Set();
  Object.values(store.progress).forEach(p=>{ if(p && p.ts) s.add(localDateStr(new Date(p.ts))); });
  Object.keys(store.wordsDone||{}).forEach(d=>s.add(d));

}
function calcStreak(){
  const set=learnedDateSet();
  if(!set.size) return 0;
  let d=new Date();
  if(!set.has(localDateStr(d))) d=new Date(d.getFullYear(), d.getMonth(), d.getDate()-1); // 今天还没学，从昨天起算
  let n=0;
  while(set.has(localDateStr(d))){ n++; d=new Date(d.getFullYear(), d.getMonth(), d.getDate()-1); }
  return n;
}

  const q=normText(libFilter.q);
  let items=DB.allSentences.filter(s=>{
    if(libFilter.cat!=='all' && (s.cat||'daily')!==libFilter.cat) return false;
    if(q && !normText(s.en).includes(q) && !(s.zh&&s.zh.includes(libFilter.q))) return false;
    return true;
  });
  // 按 id 稳定排序，长句靠后
  items=items.slice().sort((a,b)=> (wordCount(b.en)>=30?1:0)-(wordCount(a.en)>=30?1:0));
  if(!items.length){ list.innerHTML=emptyHtml('没有匹配的句子'); return; }
  list.innerHTML=items.slice(0,120).map(s=>sentenceCard(s)).join('');
  if(items.length>120) list.innerHTML+=`<div class="hint-line">… 还有 ${items.length-120} 句，用搜索精确定位</div>`;
  bindSentenceCards(list);
}

// 字幕解析
function parseSubtitles(raw, filename){
  const lines=String(raw||'').replace(/\r/g,'').split('\n');
  const out=[]; const seen=new Set();
  let idx=0;
  // SRT / VTT：数字序号 + 时间轴
  for(let i=0;i<lines.length;i++){
    const l=lines[i].trim();
    if(/^\d+$/.test(l)){ // SRT 序号
      // 收集后续非空行（直到空行）
      let texts=[]; let k=i+1;
      while(k<lines.length && !/-->/.test(lines[k])){ if(lines[k].trim()) texts.push(lines[k].trim()); k++; }
      if(k<lines.length && /-->/.test(lines[k])) k++;
      while(k<lines.length && lines[k].trim()){ texts.push(lines[k].trim()); k++; }
      i=k-1;
      const joined=texts.join(' ');
      pushSub(joined, out, seen, filename);
    }
  }
  // ASS：Dialogue: 层,标记,角色,...,文本
  const assLines=lines.filter(l=>/^Dialogue:\s*/i.test(l));
  if(assLines.length){
    for(const l of assLines){
      const parts=l.replace(/^Dialogue:\s*/i,'').split(',');
      const text=parts.slice(9).join(',').replace(/\{[^}]*\}/g,'').trim();
      pushSub(text, out, seen, filename);
    }
  }
  // 若上面没解析到（纯文本/双语每行），逐行处理
  if(!out.length){
    for(const l of lines){
      let t=l.trim().replace(/^[0-9]+\s*/,'').replace(/-->.*$/,'').replace(/\{[^}]*\}/g,'').replace(/<[^>]+>/g,'').trim();
      pushSub(t, out, seen, filename);
    }
  }
  return out;
}
function pushSub(text, out, seen, source){
  if(!text) return;
  // 剥离时间戳/标签残留
  text=text.replace(/\d{2}:\d{2}[:,]\d{2}/g,' ').replace(/\s+/g,' ').trim();
  // 中英分离
  const zh=(text.match(/[\u4e00-\u9fff][\u4e00-\u9fff，。！？、；：""''（）《》\s]*/g)||[]).join('');
  let en=text.replace(/[\u4e00-\u9fff][\u4e00-\u9fff，。！？、；：""''（）《》\s]*/g,' ').replace(/\s+/g,' ').trim();
  const wc=wordCount(en);
  if(wc<3||wc>20) return;
  if(!/^[A-Za-z]/.test(en)) return;
  const id='sub_'+djb2(normText(en)).toString(36).padStart(7,'0').slice(0,7);
  if(seen.has(id)) return; seen.add(id);
  out.push({id, en, zh:zh.trim(), cat:'subtitle', level: wc>=15?'B2':(wc>=10?'B1':'A2'), tags:['字幕'], source:source||'导入'});
}
function doImportSub(view){
  const raw=$('#subText').value.trim();
  const alert=$('#importAlert');
  if(!raw){ alert.className='alert err show'; alert.textContent='请先粘贴字幕或选择文件'; return; }
  const parsed=parseSubtitles(raw, '粘贴字幕');
  if(!parsed.length){ alert.className='alert err show'; alert.textContent='没解析到有效句子（需 3~20 个英文单词/句）。请检查字幕格式。'; return; }
  const before=store.imported.length; const known=new Set(store.imported.map(s=>s.id));
  for(const s of parsed) if(!known.has(s.id)) store.imported.push(s);
  const added=store.imported.length-before;
  saveStore(); DB.allSentences=[...store.imported, ...DB.corpus];
  alert.className='alert ok show'; alert.textContent=`✓ 解析出 ${parsed.length} 句，新增 ${added} 句（已存入句库"字幕"分类）`;
  renderImportedList(view);
  $('#subText').value='';
}
function exportSubs(){
  if(!store.imported.length){ toast('还没有可导出的导入句'); return; }

  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='imported-sentences-'+localDateStr()+'.json'; a.click();
  toast('已导出 JSON 备份');
}

function startReminderLoop(){
  requestNotifyPermission();
  checkReminder();                               // 打开时若已过点且未学习，立即检查
  setInterval(checkReminder, 60*1000);           // 每分钟检查
}

// ---------- 启动 ----------
(async function init(){
  loadStore();
  applyTheme();
  setupAvatar();
  try{
    await loadAll();
  }catch(e){
    console.error('加载数据失败', e);
    DB.today=localGeneratePlan([], [], localDateStr());
  }
  // 顶栏：英文日期 + 时间（走时）
  const tick=()=>{ const el=$('#headerDate'); if(el) el.textContent=fmtHeaderDateTime(); };
  tick(); setInterval(tick, 15000);
  if(!SR) setTimeout(()=>toast(DICTATION_SETUP_TIP, 4500), 800);
  render();
  startReminderLoop();
})();
</script>
</body>
</html>
